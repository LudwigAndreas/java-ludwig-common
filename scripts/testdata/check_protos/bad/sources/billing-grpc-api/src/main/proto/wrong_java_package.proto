syntax = "proto3";

// E_JAVA_PACKAGE: a java_package of the author's own choosing.
package ludwig.billing.v1;

option java_package = "com.example.billing";
option java_multiple_files = true;

// E_IDEMPOTENCY_UNDECLARED, three ways: no body, an empty body, and a body whose only mention of
// the option is this comment - option idempotency_level = IDEMPOTENT;
service BillingService {
  rpc NoBody(Req) returns (Res);
  rpc EmptyBody(Req) returns (Res) {}
  rpc OnlyAComment(Req) returns (Res) {
    // option idempotency_level = IDEMPOTENT;
    option deprecated = true;
  }
}

message Req {}
message Res {}
