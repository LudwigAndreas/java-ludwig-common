architecture.rules.service-name = file-ingest-spring-boot-starter
architecture.rules.conventions.types.base-entity = ru.ludwigandreas.db.core.entity.AbstractEntity
architecture.rules.conventions.types.base-exception = ru.ludwigandreas.webcore.problem.LocalizedException

# The auto-configuration classes live in ..autoconfigure.. rather than in ..config.., which is this
# module's one departure from the layout the other starters use, and it is a correctness fix rather
# than a preference: with the wiring and the properties in one package, `config` creates the engine's
# beans and the engine reads `config`'s properties, which is a package cycle the shared
# cycles rule correctly refused. Splitting them leaves `config` holding only the bound properties and
# the startup validator, and nothing in the module depends on `autoconfigure` at all.
#
# Told to the rule library rather than suppressed, so the bean definitions are still required to be
# in one place - which is what the rule is actually for.
architecture.rules.conventions.packages.configuration.add = ..autoconfigure..

architecture.rules.report.json-file = target/architecture-report.json
architecture.rules.report.max-violations-per-rule = 5
