info:
  description: |
    Create, read, update and delete products, and search them with the
    OData query options. Which rows a caller sees is decided by the
    scoped query rather than by the endpoint, so two callers may get
    different results from the same request.

    Errors are RFC 9457 problem documents. Branch on `code`, which is
    stable; `detail` is localized from the caller's Accept-Language and
    is written for a human.
  title: Product catalog
  version: v1
openapi: 3.0.1
paths:
  /admin/v1/exports/runs:
    get:
      operationId: runs
      parameters:
      - in: query
        name: requester
        required: false
        schema:
          type: string
      - in: query
        name: report
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - EXPIRED
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminPageRunView'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      tags:
      - export-admin-controller
  /admin/v1/exports/runs/{runId}:
    get:
      operationId: run_2
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RunView'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      tags:
      - export-admin-controller
  /admin/v1/exports/runs/{runId}/cancel:
    post:
      operationId: cancel_2
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RunView'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      tags:
      - export-admin-controller
  /admin/v1/exports/subscriptions:
    get:
      operationId: subscriptions
      parameters:
      - in: query
        name: owner
        required: false
        schema:
          type: string
      - in: query
        name: report
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionView'
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      tags:
      - export-admin-controller
  /admin/v1/fileactions/submissions:
    get:
      operationId: submissions
      parameters:
      - in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: submitter
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - EXPIRED
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: size
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminPageSubmissionView'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      tags:
      - file-action-admin-controller
  /admin/v1/fileactions/submissions/{id}:
    get:
      operationId: submission
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubmissionView'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      tags:
      - file-action-admin-controller
  /admin/v1/fileactions/submissions/{id}/cancel:
    post:
      operationId: cancel_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubmissionView'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
