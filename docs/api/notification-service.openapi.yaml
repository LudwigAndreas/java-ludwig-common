          type: string
        id:
          format: uuid
          type: string
        reason:
          type: string
      title: SuppressionResponse
      type: object
    Transition:
      properties:
        attemptNumber:
          format: int32
          type: integer
        detail:
          type: string
        occurredAt:
          format: date-time
          type: string
        status:
          enum:
          - PENDING
          - PROCESSING
          - PUBLISHED
          - FAILED
          - DEAD_LETTER
          - DISCARDED
          type: string
      title: Transition
      type: object
    WithdrawAnnouncementRequest:
      description: Withdraw a published announcement. The reason is optional.
      properties:
        reason:
          maxLength: 500
          minLength: 0
          type: string
      title: WithdrawAnnouncementRequest
      type: object
