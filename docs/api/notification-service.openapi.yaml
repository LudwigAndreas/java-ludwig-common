      title: AdminPage
      type: object
    Announcement:
      description: One announcement visible to the caller
      properties:
        bodyHtml:
          type: string
        bodyText:
          type: string
        category:
          type: string
        categoryClass:
          enum:
          - TRANSACTIONAL
          - PLATFORM
          - MARKETING
          type: string
        dismissed:
          type: boolean
        id:
          format: uuid
          type: string
        locale:
          description: The language this content was rendered in
          type: string
        publishedAt:
          format: date-time
          type: string
        subject:
          type: string
        visibleFrom:
          format: date-time
          type: string
        visibleUntil:
          format: date-time
          type: string
      title: AnnouncementResponse
      type: object
    AnnouncementAdmin:
      description: One announcement as its publisher sees it, audience included
      properties:
        audienceType:
          enum:
          - EVERYONE
          - ROLE
          type: string
        audienceValue:
          type: string
        category:
          type: string
        categoryClass:
          enum:
          - TRANSACTIONAL
          - PLATFORM
          - MARKETING
          type: string
        emailRunId:
          format: uuid
          type: string
