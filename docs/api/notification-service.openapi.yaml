  /api/v1/announcements:
    get:
      description: Newest first, dismissed ones excluded, and only those inside their visibility window. Visibility is resolved from the caller's CURRENT roles on every request, so a revoked role stops granting it immediately. Supports $filter/$orderby/$top/$skip over the published surface - the audience is deliberately not filterable.
      operationId: list_2
      parameters:
      - in: query
        name: options
        required: true
        schema:
          $ref: '#/components/schemas/ODataQueryOptions'
      - description: OData filter expression, e.g. price lt 100 and category/code eq 'TOOLS'. Which properties may appear is decided by the entity's policy.
        in: query
        name: $filter
        required: false
        schema:
          type: string
      - description: Ordering clause, e.g. name desc, createdAt asc. The server appends its own tie-breaker so that paging stays deterministic.
        in: query
        name: $orderby
        required: false
        schema:
          type: string
      - description: Page size. Capped by the endpoint's maximum.
        in: query
        name: $top
        required: false
        schema:
          format: int32
          type: integer
      - description: Absolute row offset. Need not be a multiple of $top; the response reports the offset that was applied.
        in: query
        name: $skip
        required: false
        schema:
          format: int32
          type: integer
      - description: Whether to compute the total. Defaults to true; pass false to skip the count query, and the response then carries no total.
        in: query
        name: $count
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseAnnouncement'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      summary: List the announcements addressed to the caller
      tags:
      - Announcements
    post:
      description: The category decides the class and the channels - the request cannot. Returns 201 with the announcement, which is already visible if its window has opened. Where the category includes EMAIL, emailRunId names the fan-out operation to poll.
      operationId: publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAnnouncementRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AnnouncementAdmin'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      summary: Publish an announcement
      tags:
      - Announcement administration
  /api/v1/announcements/outstanding-count:
    get:
      description: Returns no content. Dismissed announcements are not counted. Separate from the inbox count because the two feeds are separate; summing them is the client's decision.
      operationId: outstandingCount
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AnnouncementSummary'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      summary: Count the caller's outstanding announcements
      tags:
      - Announcements
  /api/v1/announcements/{id}:
    get:
      description: In the caller's own language, falling back to the deployment default. Includes announcements the caller has dismissed, because dismissing is not deleting. Answers 404 both when the announcement does not exist and when it is not addressed to this caller - the two are deliberately indistinguishable, so that a status code cannot be used to map which roles the platform addresses.
      operationId: get_3
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Announcement'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      summary: Read one announcement
      tags:
      - Announcements
  /api/v1/announcements/{id}/corrections:
    post:
      description: Re-renders every supported locale together, so the languages cannot drift apart. Dismissals are preserved - a typo fix does not un-dismiss anything. The audience cannot be changed; the window is changed through its own endpoint.
      operationId: correct
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAnnouncementRequest'
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AnnouncementAdmin'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: RFC 9457 problem document. Branch on `code`, never on `detail`.
      summary: Correct a published announcement's content
      tags:
      - Announcement administration
