    ProblemDetail:
      description: RFC 9457 problem document, as produced by web-core-spring-boot-starter.
      properties:
        code:
          description: Stable machine-readable code. Branch on this, never on detail.
          type: string
        detail:
          description: Localized explanation, for a human.
          type: string
        instance:
          description: URI of the request that failed.
          type: string
        status:
          description: HTTP status code.
          type: integer
        title:
          description: Short, localized summary.
          type: string
        traceId:
          description: Trace id, for correlating with the logs.
          type: string
        type:
          description: URI identifying the problem type.
          type: string
      type: object
    PublishAnnouncementRequest:
      description: Publish one announcement. The category decides its class and channels.
      properties:
        audienceType:
          enum:
          - EVERYONE
          - ROLE
          type: string
        audienceValue:
          description: The role code for a ROLE audience; omit for EVERYONE
          maxLength: 128
          minLength: 0
          type: string
        category:
          maxLength: 255
          minLength: 0
          type: string
        templateKey:
          maxLength: 128
          minLength: 0
          pattern: '[a-z0-9][a-z0-9._-]*'
          type: string
        variables:
          additionalProperties:
            type: object
          type: object
        visibleFrom:
          format: date-time
          type: string
        visibleUntil:
          format: date-time
          type: string
      required:
      - audienceType
      - category
      - templateKey
      - visibleUntil
      title: PublishAnnouncementRequest
      type: object
