    get:
      description: Progress while it runs, terminal when it has finished. The total is nullable until the audience has been walked, because counting a hundred thousand rows up front would delay the first send to produce a number nobody is waiting for.
      operationId: emailRun
      parameters:
      - in: path
        name: id
        required: true
