      type: object
    AnnouncementSummary:
      description: The caller's outstanding announcement count
      properties:
        outstanding:
          format: int64
          type: integer
      title: AnnouncementSummaryResponse
      type: object
    ApprovalView:
      properties:
        body:
          type: string
