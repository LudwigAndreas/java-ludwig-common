# Русские тексты ошибок модуля. Сервис, которому нужна другая формулировка, объявляет те же ключи
# в собственном bundle - он всегда просматривается первым, поэтому переопределение не требует
# ни форка, ни настройки.
#
# У каждого ключа есть сосед `.title`: web-core подставляет его в поле `title` документа проблемы,
# а сообщение - в `detail`.

ludwig.user-settings.error.unknown-setting.title=Неизвестная настройка
ludwig.user-settings.error.unknown-setting=Настройки с именем "{0}" не существует.

ludwig.user-settings.error.not-editable.title=Настройка недоступна для изменения
ludwig.user-settings.error.not-editable=Настройку "{0}" здесь изменить нельзя.

ludwig.user-settings.error.access-denied.title=Доступ запрещён
ludwig.user-settings.error.access-denied=У вас нет прав просматривать или изменять эти настройки.

ludwig.user-settings.error.tenant-unresolvable.title=Настройки недоступны
ludwig.user-settings.error.tenant-unresolvable=Не удалось определить настройки для этой учётной записи.

ludwig.user-settings.error.conversion.title=Не удалось прочитать настройку
ludwig.user-settings.error.conversion=Сохранённое значение "{0}" не является корректным значением типа {1}.

ludwig.user-settings.error.read-only.title=Настройки доступны только для чтения
ludwig.user-settings.error.read-only=Этот сервис хранит копию настроек только для чтения. Измените \
их там, где ведётся учётная запись.

ludwig.user-settings.error.configuration.title=Ошибка конфигурации настроек
ludwig.user-settings.error.configuration=Эта настройка сконфигурирована в сервисе некорректно.

# Валидация. Отклонённое значение возвращается под кодом самого нарушения, поэтому это полноценные
# коды проблем, а не внутренние причины.
ludwig.user-settings.validation.required.title=Требуется значение
ludwig.user-settings.validation.required=Необходимо указать значение.

ludwig.user-settings.validation.one-of.title=Недопустимое значение
ludwig.user-settings.validation.one-of=Значение должно быть одним из: {0}.

ludwig.user-settings.validation.range.title=Значение вне диапазона
ludwig.user-settings.validation.range=Значение должно быть в диапазоне от {0} до {1}.

ludwig.user-settings.validation.max-length.title=Значение слишком длинное
ludwig.user-settings.validation.max-length=Значение должно быть не длиннее {0} символов.

ludwig.user-settings.validation.pattern.title=Неверный формат значения
ludwig.user-settings.validation.pattern=Значение не соответствует ожидаемому формату.
