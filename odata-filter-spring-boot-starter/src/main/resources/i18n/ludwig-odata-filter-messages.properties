# Shipped fallback text for this module's query errors (English), contributed to the shared problem
# pipeline as a ProblemMessageBundle - see ODataFilterWebAutoConfiguration.
#
# A service that wants different wording defines the same key in its own bundle; resolution prefers
# the application's, so overriding one message needs no configuration and no fork of this module.

ludwig.odata.error.invalid-query.title=Invalid query
ludwig.odata.error.invalid-query=The query options could not be applied.

ludwig.odata.error.syntax.title=Invalid query
ludwig.odata.error.syntax=The $filter or $orderby expression could not be parsed.

ludwig.odata.error.unfilterable-field.title=Invalid query
ludwig.odata.error.unfilterable-field=One of the fields in the query cannot be used for filtering or sorting. See "property".

ludwig.odata.error.field-forbidden.title=Forbidden
ludwig.odata.error.field-forbidden=You are not allowed to filter or sort on one of the fields in this expression. See "property".

ludwig.odata.error.depth-exceeded.title=Invalid query
ludwig.odata.error.depth-exceeded=The $filter expression is nested more than {0} levels deep.

ludwig.odata.error.page-size-exceeded.title=Invalid query
ludwig.odata.error.page-size-exceeded=The requested page size is larger than the maximum of {0} this endpoint allows.

ludwig.odata.error.validation.title=Invalid query
ludwig.odata.error.validation=The query was rejected by a validation rule.
