# Shipped fallback text for every framework-level problem this starter emits (English).
#
# A service that wants different wording defines the same key in its own bundle - ProblemMessages
# looks there first, so overriding one message needs no configuration and no fork.
#
# Keys come in pairs: `<code>` is the problem's `detail`, `<code>.title` is its `title`.
# {0}, {1}, ... are java.text.MessageFormat arguments supplied by the mapper that produced the code.
#
# Two groups below. The specific codes are the ones a mapper chose because it knew the cause exactly;
# the generic per-status codes are the floor - ProblemCodes.forStatus() derives them from the status
# alone, so a failure nothing recognised still comes back localized and with a code.

# --- specific causes ----------------------------------------------------------------------------
ludwig.web.error.validation.title=Invalid request
ludwig.web.error.validation=The request contains invalid fields. See "violations" for details.

ludwig.web.error.bad-request.title=Invalid request
ludwig.web.error.bad-request=The request is missing a required value, or one of its values could not be read. See "parameter" for the name.

ludwig.web.error.malformed-request.title=Malformed request
ludwig.web.error.malformed-request=The request body could not be parsed.

ludwig.web.error.method-not-allowed.title=Method not allowed
ludwig.web.error.method-not-allowed=This resource does not support {0} requests. See the Allow header for the methods it does support.

ludwig.web.error.unsupported-media-type.title=Unsupported media type
ludwig.web.error.unsupported-media-type=This resource cannot accept a request body of type {0}.

ludwig.web.error.not-acceptable.title=Not acceptable
ludwig.web.error.not-acceptable=This resource cannot produce a response in any of the formats you accept.

ludwig.web.error.unauthorized.title=Unauthorized
ludwig.web.error.unauthorized=Authentication is required to access this resource.

ludwig.web.error.forbidden.title=Forbidden
ludwig.web.error.forbidden=You are not allowed to perform this operation.

ludwig.web.error.not-found.title=Not found
ludwig.web.error.not-found=The requested resource does not exist.

ludwig.web.error.conflict.title=Conflict
ludwig.web.error.conflict=The request conflicts with the current state of the resource.

ludwig.web.error.concurrent-modification.title=Conflicting update
ludwig.web.error.concurrent-modification=Someone else changed this resource at the same time. Re-read it and apply your change again.

ludwig.web.error.payload-too-large.title=Request too large
ludwig.web.error.payload-too-large=The request body exceeds the maximum size this endpoint accepts.

ludwig.web.error.too-many-requests.title=Too many requests
ludwig.web.error.too-many-requests=You have exceeded the request rate allowed for this resource. Retry later.

ludwig.web.error.internal.title=Internal error
ludwig.web.error.internal=The request could not be processed. If it keeps happening, quote the trace id from this response.

ludwig.web.error.upstream-unavailable.title=Service temporarily unavailable
ludwig.web.error.upstream-unavailable=A service this request depends on did not respond. Retry later.

