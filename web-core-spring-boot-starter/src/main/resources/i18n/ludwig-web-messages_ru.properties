# Russian bundle. Read as UTF-8 - see ProblemMessages, which sets the encoding explicitly rather
# than relying on the platform default.
#
# Every key in ludwig-web-messages.properties must also exist here: a key present in one bundle and
# absent in the other is how an API ends up answering half in one language and half in another.

# --- specific causes ----------------------------------------------------------------------------
ludwig.web.error.validation.title=Некорректный запрос
ludwig.web.error.validation=Запрос содержит некорректные поля. Подробности - в поле "violations".

ludwig.web.error.bad-request.title=Некорректный запрос
ludwig.web.error.bad-request=В запросе отсутствует обязательное значение либо одно из значений не удалось прочитать. Имя - в поле "parameter".

ludwig.web.error.malformed-request.title=Нечитаемый запрос
ludwig.web.error.malformed-request=Не удалось разобрать тело запроса.

ludwig.web.error.method-not-allowed.title=Метод не поддерживается
ludwig.web.error.method-not-allowed=Ресурс не поддерживает запросы типа {0}. Допустимые методы перечислены в заголовке Allow.

ludwig.web.error.unsupported-media-type.title=Неподдерживаемый тип содержимого
ludwig.web.error.unsupported-media-type=Ресурс не принимает тело запроса типа {0}.

ludwig.web.error.not-acceptable.title=Неприемлемый формат ответа
ludwig.web.error.not-acceptable=Ресурс не может вернуть ответ ни в одном из запрошенных форматов.

ludwig.web.error.unauthorized.title=Не аутентифицирован
ludwig.web.error.unauthorized=Для доступа к этому ресурсу требуется аутентификация.

ludwig.web.error.forbidden.title=Доступ запрещён
ludwig.web.error.forbidden=У вас нет прав на выполнение этой операции.

ludwig.web.error.not-found.title=Не найдено
ludwig.web.error.not-found=Запрошенный ресурс не существует.

ludwig.web.error.conflict.title=Конфликт
ludwig.web.error.conflict=Запрос противоречит текущему состоянию ресурса.

ludwig.web.error.concurrent-modification.title=Конфликт изменений
ludwig.web.error.concurrent-modification=Ресурс был изменён параллельно. Перечитайте его и повторите изменение.

ludwig.web.error.payload-too-large.title=Слишком большой запрос
ludwig.web.error.payload-too-large=Тело запроса превышает максимально допустимый размер.

ludwig.web.error.too-many-requests.title=Слишком много запросов
ludwig.web.error.too-many-requests=Превышена допустимая частота запросов к этому ресурсу. Повторите позже.

ludwig.web.error.internal.title=Внутренняя ошибка
ludwig.web.error.internal=Не удалось обработать запрос. Если ошибка повторяется, укажите идентификатор трассировки из этого ответа.

ludwig.web.error.upstream-unavailable.title=Сервис временно недоступен
ludwig.web.error.upstream-unavailable=Сервис, от которого зависит запрос, не ответил. Повторите позже.

# --- generic per-status floor -------------------------------------------------------------------
ludwig.web.error.invalid.title=Некорректный запрос
ludwig.web.error.invalid=Запрос не может быть обработан в таком виде.

ludwig.web.error.gone.title=Больше не доступно
ludwig.web.error.gone=Ресурс был удалён безвозвратно.

ludwig.web.error.precondition-failed.title=Предусловие не выполнено
ludwig.web.error.precondition-failed=Условие, указанное в запросе, не соответствует текущему состоянию ресурса.

ludwig.web.error.unprocessable.title=Невозможно обработать
ludwig.web.error.unprocessable=Запрос корректен, но его содержимое не может быть применено.

ludwig.web.error.locked.title=Ресурс заблокирован
ludwig.web.error.locked=Ресурс изменяется другой операцией. Повторите чуть позже.

ludwig.web.error.not-implemented.title=Не реализовано
ludwig.web.error.not-implemented=Операция недоступна.

ludwig.web.error.bad-gateway.title=Ошибка вышестоящего сервиса
ludwig.web.error.bad-gateway=Сервис, от которого зависит запрос, ответил некорректно.

ludwig.web.error.service-unavailable.title=Сервис недоступен
ludwig.web.error.service-unavailable=Сервис не может обработать запрос в данный момент. Повторите позже.

ludwig.web.error.gateway-timeout.title=Таймаут вышестоящего сервиса
ludwig.web.error.gateway-timeout=Сервис, от которого зависит запрос, не ответил за отведённое время.
