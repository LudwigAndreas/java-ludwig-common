# validate, not create: the module's tables come from its shipped changelog, and this is what
# cross-checks that changelog against the JPA mappings on every test run.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/test/test-changelog.xml
logging.level.org.hibernate.SQL=WARN
logging.level.ru.ludwigandreas.reconciliation=DEBUG

# The tests drive every pass by hand, so nothing fires on a schedule: an assertion about what one pass
# did is only meaningful when no other pass is running at the same time.
ludwig.reconciliation.defaults.schedule.fixed-delay=1h
ludwig.reconciliation.defaults.schedule.initial-delay=1h
ludwig.reconciliation.defaults.apply.fixed-delay=1h
ludwig.reconciliation.reclaim.fixed-delay=1h

ludwig.reconciliation.tasks.billing-status.fetch.shape=batched
ludwig.reconciliation.tasks.billing-status.fetch.batch-size=50
ludwig.reconciliation.tasks.billing-status.retry.max-attempts=2
ludwig.reconciliation.tasks.billing-status.retry.initial-interval=1ms
ludwig.reconciliation.tasks.billing-status.retry.max-interval=10ms
ludwig.reconciliation.tasks.billing-status.retry.jitter=0
ludwig.reconciliation.tasks.billing-status.schedule.run-timeout=5m

ludwig.reconciliation.tasks.partner-catalogue.fetch.shape=paged
ludwig.reconciliation.tasks.partner-catalogue.fetch.page-size=2
ludwig.reconciliation.tasks.partner-catalogue.fetch.checkpoint=true
ludwig.reconciliation.tasks.partner-catalogue.retry.max-attempts=2
ludwig.reconciliation.tasks.partner-catalogue.retry.initial-interval=1ms
ludwig.reconciliation.tasks.partner-catalogue.retry.max-interval=10ms
ludwig.reconciliation.tasks.partner-catalogue.retry.jitter=0
ludwig.reconciliation.tasks.partner-catalogue.schedule.run-timeout=5m

ludwig.reconciliation.tasks.partner-bulk-status.fetch.shape=async-job
ludwig.reconciliation.tasks.partner-bulk-status.fetch.submit-batch-size=10
ludwig.reconciliation.tasks.partner-bulk-status.quota=partner-exports
ludwig.reconciliation.tasks.partner-bulk-status.schedule.run-timeout=5m
ludwig.reconciliation.tasks.partner-bulk-status.job.submit.fixed-delay=1h
ludwig.reconciliation.tasks.partner-bulk-status.job.submit.max-concurrent-submits=2
ludwig.reconciliation.tasks.partner-bulk-status.job.poll.fixed-delay=1h
ludwig.reconciliation.tasks.partner-bulk-status.job.collect.fixed-delay=1h
ludwig.reconciliation.tasks.partner-bulk-status.job.max-lifetime=6h
ludwig.reconciliation.tasks.partner-bulk-status.job.on-ambiguous-submit=assume-submitted
# Zero, so a test can resolve an ambiguous submit without waiting out a grace period.
ludwig.reconciliation.tasks.partner-bulk-status.job.submit-grace-period=0s

ludwig.reconciliation.quotas.partner-exports.max-concurrent=2
ludwig.reconciliation.quotas.partner-exports.lease-ttl=15m
ludwig.reconciliation.quotas.partner-exports.heartbeat-interval=2m
ludwig.reconciliation.quotas.partner-exports.max-lifetime=6h

# rest-client-spring-boot-starter is an optional dependency of this module, so it lands on the test
# classpath automatically. Its own autoconfiguration wants spring-security-oauth2-client, which this
# module has no reason to pull in, and none of these tests declares a named HTTP client - the
# RestClientPresence integration is covered by the validator's unit tests instead. Excluding the whole
# set keeps the test classpath honest about what this module actually requires at runtime.
spring.autoconfigure.exclude=\
  ru.ludwigandreas.restclient.config.RestClientAutoConfiguration,\
  ru.ludwigandreas.restclient.config.RestClientAuthAutoConfiguration,\
  ru.ludwigandreas.restclient.config.RestClientObservabilityAutoConfiguration,\
  ru.ludwigandreas.restclient.config.RestClientInterfaceAutoConfiguration,\
  ru.ludwigandreas.restclient.config.RestClientWebCoreAutoConfiguration
