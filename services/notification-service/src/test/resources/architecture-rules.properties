# Architecture rules for this service. The annotation on ArchitectureTest says which packages to
# analyse and which groups apply; everything a service has to name for itself lives here, where it
# can be reviewed and templated across services without touching test code.

architecture.rules.service-name = notification-service

# The shared base types the rules check against. Both come from this repository's own starters, which
# is the point: the rule is configuration, not a hardcoded name.
architecture.rules.conventions.types.base-entity = ru.ludwigandreas.db.core.entity.AbstractEntity
architecture.rules.conventions.types.base-exception = ru.ludwigandreas.webcore.problem.LocalizedException

# Reports: the console one is read when the build goes red, the JSON one is collected by CI and
# pooled into the org-wide architecture dashboard.
architecture.rules.report.json-file = target/architecture-report.json
architecture.rules.report.max-violations-per-rule = 5

# This service's configuration lives in two packages on purpose, so the default single-package
# convention is widened rather than the rule switched off.
#
#   config   - the composition root: @Configuration classes that wire beans together, and which
#              therefore depend on the service, the repositories and the messaging adapters.
#   settings - the typed @ConfigurationProperties, which every layer reads and which therefore must
#              depend on nothing at all.
#
# Keeping them together would make one package both depend on the service layer and be depended on by
# it - a cycle that cycles.modules-are-free-of-cycles correctly rejects, and that no amount of
# rearranging inside a single package can remove.
architecture.rules.conventions.packages.configuration.add = ..settings..
