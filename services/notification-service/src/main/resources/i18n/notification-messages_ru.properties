# --- запросы ------------------------------------------------------------------------------------
# Сообщается в конверте операции, а не выбрасывается как ошибка: отклонённый запрос - это
# принятый вызов, который не дал ни одной отправки, а не сбой.
error.notification.request.rejected.title=Ничего не поставлено в очередь
error.notification.request.rejected=Запрос принят, но не дал ни одной отправки: ни для одного \
  получателя не нашлось пригодного адреса ни в одном из запрошенных каналов. Проверьте \
  получателей и их настройки каналов.

# --- inbox ---------------------------------------------------------------------------------------
# Одно сообщение для двух случаев, и формулировка должна подходить обоим. Он возвращается и когда
# уведомления не существует, и когда оно принадлежит другому человеку, и не должен намекать, какой из
# случаев произошёл: текст "не ваше" подтвердил бы, что уведомление существует. См.
# InboxItemNotFoundException.
error.notification.inbox.not-found.title=Уведомление не найдено
error.notification.inbox.not-found=Уведомление с идентификатором {0} недоступно. Возможно, его \
  никогда не существовало или оно удалено по политике хранения.

# --- announcements --------------------------------------------------------------------------------
# Одно сообщение для двух случаев, и оно не должно выдавать, какой именно. Возвращается и когда вид
# аудитории не разрешён, и когда роли нет в списке targetable-roles - причём во втором случае оно не
# должно сообщать, существует ли такая роль: автор объявления, способный различить эти два случая,
# смог бы перечислить роли организации, публикуя догадки. Детали для оператора - в логах.
# См. AudienceNotPermittedException.
error.notification.announcement.audience-not-permitted.title=Аудитория не разрешена
error.notification.announcement.audience-not-permitted=Эта установка не разрешает объявления для \
  такой аудитории. Разрешённые аудитории настраивает владелец каталога уведомлений.
error.notification.announcement.not-found.title=Объявление не найдено
error.notification.announcement.not-found=Объявление с идентификатором {0} недоступно.
error.notification.announcement.unknown-category.title=Неизвестная категория объявления
error.notification.announcement.unknown-category=В этой установке нет категории объявлений "{0}". \
  Категория определяет и возможность отказа, и отправку по почте, поэтому она не подставляется по \
  умолчанию.
error.notification.announcement.window-too-long.title=Слишком длинный период показа
error.notification.announcement.window-too-long=Запрошенный период показа ({0}) превышает \
  максимальный, разрешённый в этой установке ({1}).
