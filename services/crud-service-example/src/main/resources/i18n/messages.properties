# This service's own bundle (English). Every key here must also exist in messages_ru.properties.
# {0}, {1}, ... are java.text.MessageFormat arguments supplied by the exception that carries the code.
#
# Only this service's own vocabulary lives here. The generic HTTP errors (validation, 403, 404,
# conflict, 500) ship with web-core-spring-boot-starter, the query errors with the OData starter and
# the 401/403 wording with the security starter - each contributes its bundle to the shared problem
# pipeline, which resolves against this file first. So overriding any of their messages means adding
# that key here; nothing needs to be configured, and nothing needs to be re-handled.

error.product.not-found.title=Product not found
error.product.not-found=No product exists with id {0}.

error.product.sku-exists.title=Duplicate SKU
error.product.sku-exists=A product with SKU {0} already exists.

error.product.stale-version.title=Conflicting update
error.product.stale-version=Product {0} has changed since you read it: you sent version {1}, the current version is {2}. Re-read the product and apply your change again.

error.category.not-found.title=Unknown category
error.category.not-found=No category exists with id {0}.

catalog.validation.product.sku.required=SKU is required.
catalog.validation.product.sku.size=SKU must be at most 64 characters.
catalog.validation.product.sku.pattern=SKU may contain only capital letters, digits and hyphens, and must not start with a hyphen.
catalog.validation.product.name.required=Name is required.
catalog.validation.product.name.size=Name must be at most 255 characters.
catalog.validation.product.description.size=Description must be at most 2000 characters.
catalog.validation.product.price.required=Price is required.
catalog.validation.product.price.min=Price must not be negative.
catalog.validation.product.price.digits=Price must have at most 17 integer digits and 2 decimal places.
catalog.validation.product.supplier-cost.min=Supplier cost must not be negative.
catalog.validation.product.supplier-cost.digits=Supplier cost must have at most 17 integer digits and 2 decimal places.
catalog.validation.product.status.required=Status is required.
catalog.validation.product.stock.min=Stock quantity must not be negative.
catalog.validation.product.category.required=Category is required.
catalog.validation.product.version.min=Version must not be negative.

