# --- limits and quotas --------------------------------------------------------------------------
ludwig.export.error.row-limit-exceeded.title=Report too large
ludwig.export.error.row-limit-exceeded=This report may produce at most {0} rows and reached {1}. Narrow the parameters or the filter and try again.

ludwig.export.error.time-budget-exceeded.title=Report took too long
ludwig.export.error.time-budget-exceeded=This report may run for {0} seconds and reached {1}. Narrow the parameters or the filter and try again.

ludwig.export.error.quota-exceeded.title=Too many reports
ludwig.export.error.quota-exceeded=You have reached your {0} limit of {1} reports. Wait for one to finish, or try again later.

ludwig.export.error.access-revoked.title=Forbidden
ludwig.export.error.access-revoked=Your access to the report "{0}" changed after it was requested, so it was not produced.
ludwig.export.error.identity-unavailable.title=Cannot be produced this way
ludwig.export.error.identity-unavailable=The report "{0}" reads "{1}" using your own access, which is only possible while you wait for it. This request is too large to produce that way - narrow it, or ask an administrator to give this report its own access to that data.

