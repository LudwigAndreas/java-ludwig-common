# Shipped fallback text for this module's errors and for the strings it writes into files
# (English), contributed to the shared problem pipeline as a ProblemMessageBundle - see
# ExportWebAutoConfiguration.
#
# A service that wants different wording defines the same key in its own bundle; resolution prefers
# the application's, so overriding one message needs no configuration and no fork of this module.
#
# Every key here must also exist in ludwig-export-messages_ru.properties. Checkstyle's Translation
# check fails the build on drift, and ReportDefinitionRegistry refuses to start on a definition
# whose header or title key is missing from either bundle.

# --- request validation -------------------------------------------------------------------------
ludwig.export.error.unknown-definition.title=Report not found
ludwig.export.error.unknown-definition=This service does not publish a report called "{0}".

ludwig.export.error.unknown-format.title=Unsupported format
ludwig.export.error.unknown-format=No writer produces the format "{0}". Available formats: {1}.

