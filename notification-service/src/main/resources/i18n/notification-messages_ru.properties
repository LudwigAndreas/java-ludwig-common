# Русская локаль. Набор ключей обязан совпадать с notification-messages.properties - checkstyle-rules
# проверяет это на каждой сборке, потому что расхождение наборов означает, что часть ошибок внезапно
# приходит по-английски, и заметно это становится только у клиента.
#
# {0}, {1}, ... - аргументы java.text.MessageFormat, которые передаёт исключение с этим кодом.

# --- шаблоны -------------------------------------------------------------------------------------
error.notification.template.not-found.title=Шаблон не найден
error.notification.template.not-found=Нет шаблона с ключом "{0}" для канала {1} в локали "{2}", \
  и запасного варианта тоже нет. Проверьте ключ шаблона или добавьте недостающий вариант для канала \
  или языка.

error.notification.template.render-failed.title=Не удалось отрисовать шаблон
error.notification.template.render-failed=Шаблон "{0}" не удалось отрисовать: {1}. Передайте \
  недостающую переменную в запросе или задайте для неё значение по умолчанию в шаблоне.

# --- каналы --------------------------------------------------------------------------------------
error.notification.channel.unknown.title=Канал недоступен
error.notification.channel.unknown=В этой конфигурации нет реализации канала {0}. Это ошибка на \
  нашей стороне, а не в вашем запросе.

# --- отправки ------------------------------------------------------------------------------------
error.notification.delivery.not-found.title=Отправка не найдена
error.notification.delivery.not-found=Отправки с идентификатором {0} нет. Возможно, она удалена по \
  политике хранения.

error.notification.request.not-found.title=Запрос не найден
error.notification.request.not-found=Запроса на уведомление с идентификатором {0} нет.

error.notification.delivery.illegal-transition.title=Недопустимое состояние отправки
error.notification.delivery.illegal-transition=Отправка {0} находится в состоянии {1}, поэтому \
  действие "{2}" к ней неприменимо.

error.notification.delivery.content-unavailable.title=Содержимое уже удалено
error.notification.delivery.content-unavailable=Отрисованное содержимое отправки {0} больше \
  недоступно. Оно хранится меньше, чем сама запись об отправке.

# --- квитанции -----------------------------------------------------------------------------------
# Намеренно не уточняет, какая именно проверка не прошла: эндпоинт, который различает неверную
# подпись, просроченную метку времени и неизвестное сообщение, сам подсказывает, как их подобрать.
error.notification.receipt.invalid-signature.title=Квитанция отклонена
error.notification.receipt.invalid-signature=Квитанцию принять не удалось.

error.notification.receipt.unknown-message.title=Неизвестное сообщение
error.notification.receipt.unknown-message=Ни одна отправка не соответствует идентификатору \
  сообщения провайдера {0}.

# --- внешние провайдеры --------------------------------------------------------------------------
# Намеренно без подробностей из исходного исключения: в его тексте есть имя почтового сервера или
# URL провайдера, то есть внутренняя топология.
error.notification.upstream.mail.title=Почтовый сервер недоступен
error.notification.upstream.mail=Не удалось связаться с почтовым сервером. Запрос не отклонён - \
  повторите попытку.

error.notification.upstream.timeout.title=Провайдер не ответил
error.notification.upstream.timeout=Провайдер не ответил вовремя. Повторите попытку.

error.notification.upstream.provider.title=Провайдер отклонил запрос
error.notification.upstream.provider=Провайдер вернул ошибку. Код его ответа - в поле upstreamStatus.

# --- пакетная отправка ---------------------------------------------------------------------------
error.notification.batch.too-large.title=Пакет слишком велик
error.notification.batch.too-large=В пакете {0} запросов, а за один вызов принимается не более {1}. \
  Разделите его и отправьте частями.

