# This service's own bundle (English). Every key here must also exist in
# notification-messages_ru.properties - checkstyle-rules checks that the two key sets have not
# drifted apart, which is the failure mode of a bundle that is added to in a hurry.
#
# {0}, {1}, ... are java.text.MessageFormat arguments supplied by the exception that carries the code.
#
# Only this service's own vocabulary lives here. The generic HTTP errors (validation, 401, 403, 404,
# conflict, 500) ship with web-core-spring-boot-starter, the query errors with the OData starter and
# the 401/403 wording with the security starter - each contributes its bundle to the shared problem
# pipeline, which resolves against this file first. Overriding any of their messages means adding
# that key here; nothing needs to be configured and nothing needs to be re-handled.

# --- templates -----------------------------------------------------------------------------------
error.notification.template.not-found.title=Template not found
error.notification.template.not-found=No template exists for key "{0}" on channel {1} in locale "{2}", \
  and there is no fallback. Check the template key, or add the missing channel or locale variant.

error.notification.template.render-failed.title=Template could not be rendered
error.notification.template.render-failed=Template "{0}" could not be rendered: {1}. Supply the \
  missing variable in the request, or give the template a default for it.

# --- channels ------------------------------------------------------------------------------------
error.notification.channel.unknown.title=Channel not available
error.notification.channel.unknown=No implementation is registered for channel {0} in this \
  deployment. This is a configuration fault on our side, not a problem with your request.

# --- deliveries ----------------------------------------------------------------------------------
error.notification.delivery.not-found.title=Delivery not found
error.notification.delivery.not-found=No delivery exists with id {0}. It may have been removed by the \
  retention policy.

error.notification.request.not-found.title=Request not found
error.notification.request.not-found=No notification request exists with id {0}.

error.notification.delivery.illegal-transition.title=Delivery is in the wrong state
error.notification.delivery.illegal-transition=Delivery {0} is {1}, so it cannot be {2}ed.

error.notification.delivery.content-unavailable.title=Rendered content is gone
error.notification.delivery.content-unavailable=The rendered body of delivery {0} is no longer \
  available. Rendered content is kept for a shorter period than the delivery record itself.

# --- receipts ------------------------------------------------------------------------------------
# Deliberately says nothing about which check failed: an endpoint that distinguishes a bad signature
# from a stale timestamp from an unknown message is an oracle for probing all three.
error.notification.receipt.invalid-signature.title=Receipt rejected
error.notification.receipt.invalid-signature=The receipt could not be accepted.

error.notification.receipt.unknown-message.title=Unknown message
error.notification.receipt.unknown-message=No delivery matches provider message id {0}.

# --- upstream providers --------------------------------------------------------------------------
# These carry no detail from the underlying exception on purpose: its message names the mail host or
# the provider URL, which is internal topology.
error.notification.upstream.mail.title=Mail server unavailable
error.notification.upstream.mail=The mail server could not be reached. The request was not rejected \
  - try again.

error.notification.upstream.timeout.title=Provider did not respond
error.notification.upstream.timeout=The provider did not respond in time. Try again.

error.notification.upstream.provider.title=Provider rejected the request
error.notification.upstream.provider=The provider answered with an error. See upstreamStatus for \
  what it said.

# --- validation ----------------------------------------------------------------------------------
notification.validation.template-key.required=A template key is required.
notification.validation.template-key.size=A template key must be at most 128 characters.
notification.validation.template-key.pattern=A template key may contain only lower-case letters, \
  digits, dots, hyphens and underscores, and must start with a letter or a digit.
notification.validation.category.required=A category is required.
notification.validation.category.size=A category must be at most 128 characters.
notification.validation.category-class.required=State whether the category is TRANSACTIONAL or MARKETING.
notification.validation.priority.required=A priority is required.
notification.validation.channel.required=A channel is required.
notification.validation.channels.required=At least one channel is required.
notification.validation.recipients.required=At least one recipient is required.
notification.validation.recipients.size=At most 500 recipients may be named in one request.
notification.validation.recipient.exactly-one=Give a recipient either a userId or an address, not both.
notification.validation.recipient.user-id.size=A user id must be at most 255 characters.
notification.validation.recipient.address.size=An address must be at most 512 characters.
notification.validation.recipient.locale.size=A locale must be at most 35 characters.
notification.validation.recipient.timezone.size=A timezone must be at most 64 characters.
notification.validation.profile.email.invalid=That is not a valid email address.
notification.validation.profile.email.size=An email address must be at most 320 characters.
notification.validation.profile.chat.size=A chat address must be at most 255 characters.
notification.validation.profile.webhook.size=A webhook URL must be at most 1024 characters.
notification.validation.preference.category.required=A category is required.
notification.validation.preference.source.size=A source must be at most 64 characters.
notification.validation.suppression.address.required=An address is required.
notification.validation.suppression.reason.required=A reason is required.
notification.validation.suppression.reason.size=A reason must be at most 64 characters.
notification.validation.suppression.detail.size=A detail must be at most 2000 characters.
notification.validation.receipt.message-id.required=A provider message id is required.
notification.validation.receipt.message-id.size=A provider message id must be at most 255 characters.
notification.validation.receipt.outcome.required=A receipt outcome is required.
notification.validation.receipt.detail.size=A detail must be at most 2000 characters.
