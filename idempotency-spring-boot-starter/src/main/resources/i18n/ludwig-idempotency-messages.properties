# Shipped fallback text for every problem this starter emits (English).
#
# A service that wants different wording defines the same key in its own bundle - web-core's
# ProblemMessages looks there first, so overriding one message needs no configuration and no fork.
#
# Keys come in pairs: `<code>` is the problem's `detail`, `<code>.title` is its `title`.
# {0}, {1}, ... are java.text.MessageFormat arguments supplied by the exception that produced the code.
#
# The wording is written for the developer integrating against the API, because that is who reads it: a
# duplicate key and a reused key are both things a client author has to change code to fix, and a sentence
# that only says "conflict" sends them to a log they cannot see.

ludwig.idempotency.error.in-progress.title=Request already in progress
ludwig.idempotency.error.in-progress=A request with the Idempotency-Key "{0}" is still being processed. Retry after the interval in the Retry-After header; do not change the request body, and do not generate a new key.

ludwig.idempotency.error.not-replayable.title=Result no longer available
ludwig.idempotency.error.not-replayable=The request with the Idempotency-Key "{0}" was already processed, but its response was not stored and cannot be returned. Do not retry with this key: retrying will produce this same answer. Query the resource directly to find out what was created.

ludwig.idempotency.error.fingerprint-mismatch.title=Idempotency key reused
ludwig.idempotency.error.fingerprint-mismatch=The Idempotency-Key "{0}" was already used for a different request. Use a new key for a new request, and reuse a key only to retry the exact request it was first sent with.

ludwig.idempotency.error.key-required.title=Idempotency key required
ludwig.idempotency.error.key-required=This endpoint requires the {0} header. Send a value your client generates once per operation and reuses for every retry of that operation.

ludwig.idempotency.error.key-too-long.title=Idempotency key too long
ludwig.idempotency.error.key-too-long=The Idempotency-Key is {0} characters long; the maximum is {1}.
