ludwig.idempotency.error.fingerprint-mismatch.title=Ключ идемпотентности использован повторно
ludwig.idempotency.error.fingerprint-mismatch=Ключ Idempotency-Key "{0}" уже использовался для другого запроса. Для нового запроса используйте новый ключ, а старый применяйте только для повтора того же самого запроса.

ludwig.idempotency.error.key-required.title=Требуется ключ идемпотентности
ludwig.idempotency.error.key-required=Для этого метода обязателен заголовок {0}. Передайте значение, которое клиент генерирует один раз на операцию и повторно использует при каждой повторной попытке.

