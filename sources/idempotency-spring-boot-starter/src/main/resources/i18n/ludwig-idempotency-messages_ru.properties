# Russian text for every problem this starter emits. The key set must match
# ludwig-idempotency-messages.properties exactly - Checkstyle's Translation check fails the build on a
# key present in one locale and absent in another, because a half-translated bundle answers some callers
# in one language and some in another depending on which error they hit.

ludwig.idempotency.error.in-progress.title=Запрос уже выполняется
ludwig.idempotency.error.in-progress=Запрос с ключом Idempotency-Key "{0}" ещё обрабатывается. Повторите попытку через интервал, указанный в заголовке Retry-After; не меняйте тело запроса и не генерируйте новый ключ.

