# Shipped text for grpc-server-spring-boot-starter (English).
#
# Two kinds of key live here. `ludwig.grpc.server.error.<code>` (+ `.title`) is a problem this
# starter raises itself and is rendered through web-core's ProblemMessages, so a service overrides
# the wording by defining the same key in its own bundle. `ludwig.grpc.server.startup.<name>` is
# what an operator reads when the server refuses a configuration or warns about one.
#
# {0}, {1}, ... are java.text.MessageFormat arguments, so a literal apostrophe must be doubled.

ludwig.grpc.server.error.saturated.title=Server busy
ludwig.grpc.server.error.saturated=The server has no capacity to accept this call. Retry later, with backoff.

ludwig.grpc.server.startup.invalid=The gRPC server cannot start; {0} problem(s) in its configuration:{1}
ludwig.grpc.server.startup.not-a-service=Bean "{0}" ({1}) carries @LudwigGrpcService but is not an io.grpc.BindableService. Put the annotation on a class that extends a generated ImplBase.
ludwig.grpc.server.startup.no-authentication=gRPC services are declared but there is no JwtDecoder bean, so callers cannot be authenticated. Configure the resource server (spring.security.oauth2.resourceserver.jwt.*), or state that this server is unauthenticated with ludwig.grpc.server.security.enabled=false.
ludwig.grpc.server.startup.unauthenticated=ludwig.grpc.server.security.enabled=false: the gRPC server serves every method WITHOUT authentication.
ludwig.grpc.server.startup.permit-unauthenticated=ludwig.grpc.server.security.permit-unauthenticated: "{0}" is served without authentication.
ludwig.grpc.server.startup.reflection-in-production=ludwig.grpc.server.reflection.enabled=true is refused while production profile(s) {0} are active: reflection publishes the whole contract to any caller. Disable it, or adjust ludwig.grpc.production-profiles.
ludwig.grpc.server.startup.plaintext-switches=The gRPC server would listen without TLS on the non-loopback address "{0}". Configure ludwig.grpc.server.tls.bundle, or permit plaintext with BOTH ludwig.grpc.server.plaintext=true and ludwig.grpc.allow-plaintext=true.
ludwig.grpc.server.startup.plaintext-in-production=The gRPC server would listen without TLS while production profile(s) {0} are active. Configure ludwig.grpc.server.tls.bundle; plaintext is never accepted in production, whatever ludwig.grpc.server.plaintext and ludwig.grpc.allow-plaintext say.
ludwig.grpc.server.startup.tls-bundle-unknown=ludwig.grpc.server.tls.bundle="{0}" names no SSL bundle. Declare it under spring.ssl.bundle.
ludwig.grpc.server.startup.idempotency-store-missing=gRPC method {0} carries @Idempotent but there is no IdempotencyStore bean. Configure a store for idempotency-spring-boot-starter, or remove the annotation.
ludwig.grpc.server.startup.idempotent-not-unary=gRPC method {0} carries @Idempotent but is not unary. Only a unary method can be replayed.
ludwig.grpc.server.startup.admin-surface-missing=gRPC methods {0} carry @AdminAccess, but the administrative surface is not configured (no operation catalog). Enable ludwig.admin, or remove the annotation.
ludwig.grpc.server.startup.admin-operation-unknown=gRPC method {0} carries @AdminAccess("{1}"), which is not in the operation catalog.
ludwig.grpc.server.startup.admin-approval-unsupported=gRPC method {0} carries @AdminAccess("{1}"), which requires four-eyes approval. Approval is HTTP-only; serve this operation over HTTP.
