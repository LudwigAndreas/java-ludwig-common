# Тексты grpc-server-spring-boot-starter (русский). Набор ключей совпадает с английским файлом.
#
# {0}, {1}, ... - аргументы java.text.MessageFormat, поэтому одиночный апостроф нужно удваивать.

ludwig.grpc.server.error.saturated.title=Сервер занят
ludwig.grpc.server.error.saturated=У сервера нет ресурсов, чтобы принять этот вызов. Повторите позже, увеличивая паузу между попытками.

ludwig.grpc.server.startup.invalid=gRPC-сервер не может стартовать; ошибок в конфигурации: {0}:{1}
ludwig.grpc.server.startup.not-a-service=Бин "{0}" ({1}) помечен @LudwigGrpcService, но не является io.grpc.BindableService. Аннотацию нужно ставить на класс, расширяющий сгенерированный ImplBase.
ludwig.grpc.server.startup.no-authentication=gRPC-сервисы объявлены, но бина JwtDecoder нет, поэтому вызывающих нельзя аутентифицировать. Настройте сервер ресурсов (spring.security.oauth2.resourceserver.jwt.*) либо явно объявите сервер неаутентифицируемым: ludwig.grpc.server.security.enabled=false.
ludwig.grpc.server.startup.unauthenticated=ludwig.grpc.server.security.enabled=false: gRPC-сервер обслуживает все методы БЕЗ аутентификации.
ludwig.grpc.server.startup.permit-unauthenticated=ludwig.grpc.server.security.permit-unauthenticated: "{0}" обслуживается без аутентификации.
ludwig.grpc.server.startup.reflection-in-production=ludwig.grpc.server.reflection.enabled=true запрещено, пока активны промышленные профили {0}: reflection раскрывает весь контракт любому вызывающему. Отключите его либо измените ludwig.grpc.production-profiles.
ludwig.grpc.server.startup.plaintext-switches=gRPC-сервер слушал бы без TLS на не-loopback адресе "{0}". Настройте ludwig.grpc.server.tls.bundle либо разрешите открытый текст ОБОИМИ ключами: ludwig.grpc.server.plaintext=true и ludwig.grpc.allow-plaintext=true.
ludwig.grpc.server.startup.plaintext-in-production=gRPC-сервер слушал бы без TLS при активных промышленных профилях {0}. Настройте ludwig.grpc.server.tls.bundle; открытый текст в промышленной среде не принимается никогда, что бы ни было задано в ludwig.grpc.server.plaintext и ludwig.grpc.allow-plaintext.
ludwig.grpc.server.startup.tls-bundle-unknown=ludwig.grpc.server.tls.bundle="{0}" не соответствует ни одному SSL-бандлу. Объявите его в spring.ssl.bundle.
ludwig.grpc.server.startup.idempotency-store-missing=gRPC-метод {0} помечен @Idempotent, но бина IdempotencyStore нет. Настройте хранилище idempotency-spring-boot-starter либо уберите аннотацию.
ludwig.grpc.server.startup.idempotent-not-unary=gRPC-метод {0} помечен @Idempotent, но не является унарным. Повторно воспроизвести можно только унарный метод.
