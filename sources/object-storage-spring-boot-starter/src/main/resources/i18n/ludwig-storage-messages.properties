# Shipped fallback text for this module's errors (English), contributed to the shared problem
# pipeline as a ProblemMessageBundle - see ObjectStorageAutoConfiguration.
#
# A service that wants different wording defines the same key in its own bundle; resolution prefers
# the application's, so overriding one message needs no configuration and no fork of this module.
#
# Every key here must also exist in ludwig-storage-messages_ru.properties. Checkstyle's Translation
# check fails the build on drift.

ludwig.storage.error.object-not-found.title=Object not found
ludwig.storage.error.object-not-found=Nothing is stored at "{0}".

ludwig.storage.error.invalid-uri.title=Invalid storage location
ludwig.storage.error.invalid-uri=The storage location "{0}" is not valid. Expected "s3://bucket/key" or "file:///path", with no ".." segment.

ludwig.storage.error.store-unavailable.title=Storage unavailable
ludwig.storage.error.store-unavailable=The object store could not complete "{0}" for "{1}".

ludwig.storage.error.access-denied.title=Storage access denied
ludwig.storage.error.access-denied=This service is not permitted to perform "{0}" on "{1}".
