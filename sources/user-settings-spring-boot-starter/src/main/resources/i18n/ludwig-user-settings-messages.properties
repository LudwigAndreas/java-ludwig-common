# Shipped fallback for the module's user-facing errors. A service that wants different wording
# defines the same keys in its own bundle - the application's bundle is always consulted first, so
# overriding any of these needs no fork and no configuration.
#
# Every key here has a `.title` sibling: web-core renders the title as the problem's `title` member
# and the message as its `detail`.

ludwig.user-settings.error.unknown-setting.title=Unknown setting
ludwig.user-settings.error.unknown-setting=There is no setting named "{0}".

ludwig.user-settings.error.not-editable.title=Setting is not editable
ludwig.user-settings.error.not-editable=The setting "{0}" cannot be changed here.

ludwig.user-settings.error.access-denied.title=Forbidden
ludwig.user-settings.error.access-denied=You are not allowed to view or change these settings.

ludwig.user-settings.error.tenant-unresolvable.title=Settings unavailable
ludwig.user-settings.error.tenant-unresolvable=Settings could not be resolved for this account.

ludwig.user-settings.error.conversion.title=Setting could not be read
ludwig.user-settings.error.conversion=The stored value for "{0}" is not a valid {1}.

ludwig.user-settings.error.read-only.title=Settings are read-only here
ludwig.user-settings.error.read-only=This service keeps a read-only copy of these settings. Change \
them where the account is managed.

ludwig.user-settings.error.configuration.title=Settings are misconfigured
ludwig.user-settings.error.configuration=This setting is not configured correctly in this service.

# Validation. A rejected value is reported under the violation's own code, so these are problem
# codes in their own right rather than internal reasons.
ludwig.user-settings.validation.required.title=Value required
ludwig.user-settings.validation.required=A value is required.

ludwig.user-settings.validation.one-of.title=Value not allowed
ludwig.user-settings.validation.one-of=The value must be one of: {0}.

ludwig.user-settings.validation.range.title=Value out of range
ludwig.user-settings.validation.range=The value must be between {0} and {1}.

ludwig.user-settings.validation.max-length.title=Value too long
ludwig.user-settings.validation.max-length=The value must be at most {0} characters long.

ludwig.user-settings.validation.pattern.title=Value has the wrong format
ludwig.user-settings.validation.pattern=The value is not in the expected format.
