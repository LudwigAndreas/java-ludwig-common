architecture.rules.service-name = asyncapi-spring-boot-starter
architecture.rules.report.json-file = target/architecture-report.json
architecture.rules.report.max-violations-per-rule = 5

# The document package reads @KafkaListener metadata and listener container factories by design, so the
# Kafka rules check it as messaging code rather than passing vacuously.
architecture.rules.conventions.packages.messaging = ..document..
