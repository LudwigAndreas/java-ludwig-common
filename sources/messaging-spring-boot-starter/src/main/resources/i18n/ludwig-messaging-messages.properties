# Shipped fallback text for every problem this starter emits (English).
#
# A service that wants different wording defines the same key in its own bundle - web-core's
# ProblemMessages looks there first, so overriding one message needs no configuration and no fork.
#
# Keys come in pairs: `<code>` is the problem's `detail`, `<code>.title` is its `title`.
# {0}, {1}, ... are java.text.MessageFormat arguments supplied by the exception that produced the code.
#
# There are only two, and that is the honest shape of a consumer module: a consumer's failures are
# answered by a dead-letter topic rather than by an HTTP response. These two exist because a service may
# re-raise them from its own surface - a replay endpoint re-feeding a dead-lettered record is the case
# this was written for - and the wording is therefore for the operator reading that response, not for an
# API client.

ludwig.messaging.error.unsupported-event-version.title=Unsupported event version
ludwig.messaging.error.unsupported-event-version=The record declares payload schema version {0}, and this consumer accepts {1} to {2}. The record was not deserialized, deliberately: mapping a newer payload onto this consumer''s current type would silently leave renamed or split fields at their defaults. Deploy a consumer that understands version {0}, or replay the record once one is running.

ludwig.messaging.error.ordering-conflicts-with-retry-topics.title=Retry topics conflict with ordering
ludwig.messaging.error.ordering-conflicts-with-retry-topics=Consumer "{0}" asks for non-blocking retry topics while declaring that it relies on ordering. A retried record is re-applied after records produced later than it, which breaks the same-key ordering the producer''s orderingKey promises. Declare ordered=false for this consumer to accept that, or leave its retries blocking.
