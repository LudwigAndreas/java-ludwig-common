architecture.rules.service-name = messaging-spring-boot-starter
architecture.rules.report.json-file = target/architecture-report.json
architecture.rules.report.max-violations-per-rule = 5

# The messaging packages of this module. Named so that the Kafka rules have something to check rather
# than passing vacuously: consumers must live here, and messaging must not depend on a web layer.
architecture.rules.conventions.packages.messaging = ..consumer.., ..dlt.., ..serialization..

# This module's configuration lives in two packages, for exactly the reason notification-service's does
# and with the same resolution - the default single-package convention is widened rather than the rule
# switched off:
#
#   config   - the autoconfigurations: they wire the container factory builder, and therefore depend on
#              the consumer package.
#   settings - the typed @ConfigurationProperties, which both the autoconfigurations and the builder
#              read, and which must therefore depend on nothing.
#
# Keeping them together made `config` depend on `consumer` and `consumer` depend on `config`, which
# cycles.modules-are-free-of-cycles correctly rejected - and no rearranging inside one package removes it.
architecture.rules.conventions.packages.configuration.add = ..settings..
