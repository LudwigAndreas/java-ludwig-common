# Shipped text for grpc-client-spring-boot-starter (English): what an operator reads when a client
# configuration is refused or warned about. The problems a caller sees come from web-core's codes.
#
# {0}, {1}, ... are java.text.MessageFormat arguments, so a literal apostrophe must be doubled.

ludwig.grpc.client.startup.invalid=The gRPC clients cannot start; {0} problem(s) in their configuration:{1}
ludwig.grpc.client.startup.target-in-defaults=ludwig.grpc.client.defaults.target is set. A target cannot be shared: set it on each client under ludwig.grpc.client.clients.<name>.target.
ludwig.grpc.client.startup.target-missing=Client "{0}" has no target. Set ludwig.grpc.client.clients.{0}.target, for example dns:///service-headless:9090.
ludwig.grpc.client.startup.deadline-not-positive=Client "{0}" has deadline {1}. Every call needs a positive deadline; there is no way to switch it off.
ludwig.grpc.client.startup.plaintext-switches=Client "{0}" would connect without TLS to the non-loopback target "{1}". Configure TLS, or permit plaintext with BOTH ludwig.grpc.client.clients.{0}.plaintext=true and ludwig.grpc.allow-plaintext=true.
ludwig.grpc.client.startup.plaintext-in-production=Client "{0}" would connect without TLS while production profile(s) {1} are active. Plaintext is never accepted in production.
ludwig.grpc.client.startup.credential-over-plaintext=Client "{0}" would send a {1} credential in plaintext to the non-loopback target "{2}". Remove plaintext, or the credential.
ludwig.grpc.client.startup.auth-type-unknown=Client "{0}" names auth.type "{1}", which nothing provides. Known types: {2}.
ludwig.grpc.client.startup.bearer-without-token=Client "{0}" uses auth.type=bearer and has no auth.token.
ludwig.grpc.client.startup.client-credentials-without-registration=Client "{0}" uses auth.type=oauth2-client-credentials and has no auth.registration-id.
ludwig.grpc.client.startup.client-credentials-unavailable=Client "{0}" uses auth.type=oauth2-client-credentials but there is no ClientRegistrationRepository bean (spring-security-oauth2-client and spring.security.oauth2.client.registration.*).
ludwig.grpc.client.startup.relay-not-enabled=Client "{0}" uses auth.type=oauth2-token-relay without ludwig.grpc.client.clients.{0}.auth.relay-enabled=true. Relaying a caller''s token is decided per client and is never inherited from defaults.
ludwig.grpc.client.startup.relay-without-resource-server=Client "{0}" relays the caller''s token, but this service is not a resource server (no JwtDecoder bean), so there is never a token to relay.
ludwig.grpc.client.startup.breaker-cannot-open=Client "{0}": the circuit breaker''s minimum-number-of-calls ({1}) exceeds its sliding-window-size ({2}), so it can never open.
ludwig.grpc.client.startup.breaker-threshold=Client "{0}": the circuit breaker''s failure-rate-threshold must be above 0 and at most 100, and is {1}.
ludwig.grpc.client.startup.payload-in-production=Client "{0}" sets logging.level=payload while production profile(s) {1} are active. Message payloads are never logged in production.
ludwig.grpc.client.startup.tls-bundle-unknown=Client "{0}": tls.bundle "{1}" names no SSL bundle. Declare it under spring.ssl.bundle.
ludwig.grpc.client.startup.unknown-client=The injection point {0} names gRPC client "{1}", which is not configured. Configured clients: {2}.
ludwig.grpc.client.startup.not-a-stub=The injection point {0} carries @LudwigGrpcClient but its type {1} is neither a generated stub nor io.grpc.Channel.
ludwig.grpc.client.startup.pick-first=Client "{0}" uses load-balancing pick_first: every call goes to one address. That is right only if the target resolves to one address, which this process cannot check.
