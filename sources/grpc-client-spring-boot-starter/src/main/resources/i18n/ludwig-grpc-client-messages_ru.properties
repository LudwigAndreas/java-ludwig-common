# Тексты grpc-client-spring-boot-starter (русский). Набор ключей совпадает с английским файлом.
#
# {0}, {1}, ... - аргументы java.text.MessageFormat, поэтому одиночный апостроф нужно удваивать.

ludwig.grpc.client.startup.invalid=gRPC-клиенты не могут стартовать; ошибок в конфигурации: {0}:{1}
ludwig.grpc.client.startup.target-in-defaults=Задан ludwig.grpc.client.defaults.target. Адрес нельзя разделять между клиентами: задайте его каждому клиенту в ludwig.grpc.client.clients.<name>.target.
ludwig.grpc.client.startup.target-missing=У клиента "{0}" нет адреса. Задайте ludwig.grpc.client.clients.{0}.target, например dns:///service-headless:9090.
ludwig.grpc.client.startup.deadline-not-positive=У клиента "{0}" дедлайн {1}. Каждому вызову нужен положительный дедлайн; отключить его нельзя.
ludwig.grpc.client.startup.plaintext-switches=Клиент "{0}" подключался бы без TLS к не-loopback адресу "{1}". Настройте TLS либо разрешите открытый текст ОБОИМИ ключами: ludwig.grpc.client.clients.{0}.plaintext=true и ludwig.grpc.allow-plaintext=true.
ludwig.grpc.client.startup.plaintext-in-production=Клиент "{0}" подключался бы без TLS при активных промышленных профилях {1}. Открытый текст в промышленной среде не принимается никогда.
ludwig.grpc.client.startup.credential-over-plaintext=Клиент "{0}" отправлял бы учётные данные {1} открытым текстом на не-loopback адрес "{2}". Уберите plaintext либо учётные данные.
ludwig.grpc.client.startup.auth-type-unknown=Клиент "{0}" указывает auth.type "{1}", который никто не предоставляет. Известные типы: {2}.
ludwig.grpc.client.startup.bearer-without-token=Клиент "{0}" использует auth.type=bearer без auth.token.
ludwig.grpc.client.startup.client-credentials-without-registration=Клиент "{0}" использует auth.type=oauth2-client-credentials без auth.registration-id.
ludwig.grpc.client.startup.client-credentials-unavailable=Клиент "{0}" использует auth.type=oauth2-client-credentials, но бина ClientRegistrationRepository нет (spring-security-oauth2-client и spring.security.oauth2.client.registration.*).
ludwig.grpc.client.startup.relay-not-enabled=Клиент "{0}" использует auth.type=oauth2-token-relay без ludwig.grpc.client.clients.{0}.auth.relay-enabled=true. Передача токена вызывающего решается для каждого клиента отдельно и никогда не наследуется из defaults.
ludwig.grpc.client.startup.relay-without-resource-server=Клиент "{0}" передаёт токен вызывающего, но сервис не является сервером ресурсов (нет бина JwtDecoder), поэтому передавать нечего.
ludwig.grpc.client.startup.breaker-cannot-open=Клиент "{0}": minimum-number-of-calls автомата ({1}) больше sliding-window-size ({2}), поэтому он никогда не разомкнётся.
ludwig.grpc.client.startup.breaker-threshold=Клиент "{0}": failure-rate-threshold автомата должен быть больше 0 и не больше 100, а задан {1}.
ludwig.grpc.client.startup.payload-in-production=Клиент "{0}" задаёт logging.level=payload при активных промышленных профилях {1}. Полезная нагрузка в промышленной среде не логируется никогда.
ludwig.grpc.client.startup.tls-bundle-unknown=Клиент "{0}": tls.bundle "{1}" не соответствует ни одному SSL-бандлу. Объявите его в spring.ssl.bundle.
ludwig.grpc.client.startup.unknown-client=Точка внедрения {0} указывает gRPC-клиент "{1}", который не настроен. Настроенные клиенты: {2}.
ludwig.grpc.client.startup.not-a-stub=Точка внедрения {0} помечена @LudwigGrpcClient, но её тип {1} не является ни сгенерированным stub, ни io.grpc.Channel.
ludwig.grpc.client.startup.pick-first=Клиент "{0}" использует балансировку pick_first: все вызовы идут на один адрес. Это верно, только если адрес разрешается в один, а процесс не может это проверить.
