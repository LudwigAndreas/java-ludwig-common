# Descriptions of the restclient administrative area's operations.
ludwig.restclient.admin.restclient.client.read=See the named outbound clients; never a credential.
ludwig.restclient.admin.restclient.breaker.read=See every replica's circuit breakers, with state and failure rate.
ludwig.restclient.admin.restclient.token.reset=Discard a client's cached machine token on every replica, so its next call mints a new one.
ludwig.restclient.admin.restclient.breaker.set=Set a client's circuit breaker on every replica - forcing it open stops all calls to that partner.
