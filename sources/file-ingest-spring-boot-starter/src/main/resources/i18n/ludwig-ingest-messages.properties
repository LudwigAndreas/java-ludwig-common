# Shipped fallback text for this module's errors (English), contributed to the shared problem
# pipeline as a ProblemMessageBundle - see FileIngestAutoConfiguration.
#
# Deliberately short. Almost nothing in this module has a caller: a scheduled ingest runs at half past
# six with nobody waiting on it, so its failures are recorded on the run row and in the log rather
# than rendered into a response - see IngestProblemCodes for the full reasoning. The one reachable
# failure is an actuator call naming a task that does not exist.
#
# Every key here must also exist in ludwig-ingest-messages_ru.properties. Checkstyle's Translation
# check fails the build on drift.

ludwig.ingest.error.unknown-task.title=Ingest task not found
ludwig.ingest.error.unknown-task=This service has no ingest task called "{0}". Configured tasks: {1}.
ludwig.ingest.admin.fileingest.read=See ingest tasks and their runs, with each run's checkpoint and counts.
ludwig.ingest.admin.fileingest.operate=Trigger an ingest pass now.
ludwig.ingest.admin.fileingest.privileged=No operation yet; reserved so that grants for this area stay the same across releases.
ludwig.ingest.admin.run-not-found=There is no run {0} of ingest task "{1}".
ludwig.ingest.admin.already-running=Ingest task "{0}" is already running on another instance; nothing was started.
