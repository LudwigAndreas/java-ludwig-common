# Detection pattern for the personal-access-token wire format, published so that a leaked token is found
# by a scanner rather than during an incident.
#
# A credential format nobody can grep for is a credential format whose leaks are discovered the hard way.
# This file exists so that CI, gitleaks, the SCM's own secret scanning and an operator with ripgrep all
# match the same shape, rather than each inventing one that is subtly different.
#
# Register this BEFORE the first token is issued. A scanner added afterwards does not see history by
# default, so tokens committed in the gap stay invisible exactly as long as they stay valid.

# The full wire form: lpat_<keyId>_<secret>_<crc32c>.
#
# The key id is 11 base62 characters, the secret is 43, and the checksum is 1-8 lowercase hex digits -
# Long.toHexString does not pad, so a CRC with leading zero bytes renders shorter. The widths are written as
# bounded ranges rather than exact values so that a change to the key-id width does not silently stop the
# scanner matching; a slightly loose range costs a rare false positive, while an exact width that has drifted
# costs every true positive.
#
# The character class is [A-Za-z0-9] and NOT [A-Za-z0-9_-]. The random parts are base62 precisely because the
# base64url alphabet contains the separator - a bug this format had briefly, where roughly one token in twenty
# contained an underscore and was unparseable. A scanner pattern that still allowed _ inside the parts would
# match across the separators and so would match malformed strings while the real format cannot produce them.
pat.detection.regex=lpat_[A-Za-z0-9]{8,16}_[A-Za-z0-9]{40,48}_[0-9a-f]{1,8}

# The prefix alone, for a cheap pre-filter: a scanner can grep for this first and apply the full pattern
# only to the lines that hit. Also what a human greps for.
pat.detection.prefix=lpat_

# A gitleaks rule body, ready to paste. Kept here rather than in the README because a scanner rule is
# configuration a tool consumes, and a copy in prose is a copy that drifts from the regex above.
pat.detection.gitleaks.id=ludwig-personal-access-token
pat.detection.gitleaks.description=Ludwig platform personal access token
pat.detection.gitleaks.keywords=lpat_
