# The application's own bundle - the first link in ProblemMessages' resolution chain.

# Its own business errors.
error.thing.not-found.title=Thing not found
error.thing.not-found=No thing exists with id {0}.

error.quota.exceeded.title=Quota exceeded
error.quota.exceeded=You may create at most {0} things.

# An override of a key the starter ships: resolution prefers this bundle, so a service can reword
# any module's message without configuration and without forking the module.
ludwig.web.error.forbidden=This operation is not available on your plan.

# Bean Validation constraint messages, resolved by key against this same bundle.
test.validation.name.required=A name is required.
test.validation.name.size=A name may be at most 8 characters.
test.validation.quantity.min=The quantity must not be negative.
