# Two locales, so the "unsupported language falls back to the default" case is testable.
ludwig.web.i18n.supported-locales=en,ru
ludwig.web.i18n.default-locale=en

# Deterministic 404s for an unmapped path rather than a container-dependent answer.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
