# This module's own run of the shared ArchUnit rule library. It had none before the audit rule needed
# one, which is why `audit.audit-types-produce-audit-events` could be written and still enforce nothing.

architecture.rules.service-name = odata-filter-spring-boot-starter

# No base entity and no base exception are named: this module declares neither. ODataFilterException is
# deliberately independent of web-core's LocalizedException - see its javadoc - so naming that base type
# here would make the rule demand the dependency the exception exists to avoid.

# ODataFilterProperties lives in ..properties.. rather than beside the auto-configuration classes in
# ..config.., and that is a correctness fix rather than a preference. With the bound properties and the
# wiring in one package, `config` referenced every package in the module to build its beans while `core`,
# `web` and `policy` each read its properties - three inbound edges that between them closed TWENTY
# distinct package cycles, which was every cycle this module had. Splitting them leaves `config` depended
# upon by nothing, which is what a wiring package should be.
#
# `file-ingest-spring-boot-starter` fixed the same problem with the opposite assignment: its wiring moved
# to ..autoconfigure.. and its properties stayed in ..config... This module keeps the wiring where it is
# because an auto-configuration class's fully-qualified name is configuration API - a deployment switches
# one off with `spring.autoconfigure.exclude=ru.ludwigandreas.odatafilter.config.ODataFilterAutoConfiguration`,
# a string in YAML that no compiler checks - so renaming that package would break an exclusion silently at
# runtime, while moving the properties class breaks a compile.
#
# Told to the rule library rather than suppressed, so a @Configuration class dropped anywhere else in this
# module is still a violation.
architecture.rules.conventions.packages.configuration.add = ..properties..

architecture.rules.report.json-file = target/architecture-report.json
architecture.rules.report.max-violations-per-rule = 5
