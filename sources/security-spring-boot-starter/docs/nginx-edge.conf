# nginx edge for browser traffic.
#
# This is the half of the design that keeps JWTs out of the browser entirely. The browser holds an
# opaque session cookie; for every request the edge asks a session service to exchange that cookie for
# a short-lived token, and forwards the token - never the cookie - to the service.
#
# What that buys:
#   - The token lives for seconds and never leaves the data centre, so an XSS that can read
#     document.cookie still gets an opaque id that is useless off-origin.
#   - Logout and forced revocation are immediate: the session store is authoritative, and the next
#     exchange simply fails. A JWT held by the browser would stay valid until it expired.
#   - The service is stateless and CSRF-free, because it receives no ambient credential. That property
#     is why ludwig.security disables CSRF - if you ever forward the cookie itself, turn it back on.
#
# Everything below other than the exchange is header hygiene and coarse denial.

upstream product_catalog {
    server product-catalog.svc.cluster.local:8080;
    keepalive 32;
}

upstream session_service {
    server session.svc.cluster.local:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The session cookie. HttpOnly keeps it out of JavaScript, SameSite=Lax is the first line of CSRF
    # defence, and Secure keeps it off plaintext. These are set by the session service on login; they
    # are repeated here as a reminder that the cookie's attributes are part of this design.
    #   Set-Cookie: SESSION=...; HttpOnly; Secure; SameSite=Lax; Path=/

    # Identity headers a client might set for itself. Cleared unconditionally: the service strips them
    # again, and doing it in both places means one missed route is not a privilege escalation.
    proxy_set_header X-Forwarded-User    "";
    proxy_set_header X-Forwarded-Email   "";
    proxy_set_header X-Forwarded-Groups  "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Ludwig-Subject    "";
    proxy_set_header X-Ludwig-Roles      "";
    proxy_set_header X-Ludwig-Tenant     "";
    # Browser traffic never carries a client certificate assertion. A request arriving here with one
    # is either confused or probing.
    proxy_set_header X-Forwarded-Client-Cert "";

    location /api/ {
        # --- session -> token exchange -------------------------------------------------------------
        # The session service reads the cookie, validates the session, and returns 200 with the minted
        # token in a response header (401 if the session is gone - which is what makes logout instant).
        auth_request      /_session_exchange;
        auth_request_set  $access_token  $upstream_http_x_access_token;
        auth_request_set  $session_user  $upstream_http_x_session_subject;

        # The token replaces the cookie: the service sees a bearer token and nothing else.
        proxy_set_header  Authorization  "Bearer $access_token";
        proxy_set_header  Cookie         "";

        proxy_set_header  X-Request-Id   $request_id;
        proxy_set_header  X-Real-IP      $remote_addr;
        proxy_set_header  Host           $host;
        proxy_http_version 1.1;
        proxy_set_header  Connection     "";

        proxy_pass http://product_catalog;
    }

    # Internal surfaces are never routed from the internet. Coarse, absolute, and exactly the kind of
    # rule an edge should carry - unlike "which orders may this user see", which it cannot express.
    location /internal/ { return 404; }
    location /actuator/ { return 404; }

    location = /_session_exchange {
        internal;
        proxy_pass              http://session_service/exchange;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        # The session service needs the cookie and the original request line: it applies CSRF
        # verification (origin check plus the double-submit token) for unsafe methods here, which is
        # the right place for it - this is the only hop that still sees the cookie.
        proxy_set_header        X-Original-URI    $request_uri;
        proxy_set_header        X-Original-Method $request_method;
        proxy_set_header        Origin            $http_origin;
    }
}
