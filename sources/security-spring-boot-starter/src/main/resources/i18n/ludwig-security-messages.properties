ludwig.security.error.unauthorized=Authentication is required to access this resource.
ludwig.security.error.forbidden.title=Forbidden
ludwig.security.error.forbidden=You are not allowed to perform this operation.
ludwig.admin.cursor-invalid=The cursor is not one this listing issued. Start again from the first page.
ludwig.admin.page-size-invalid=A page size of {0} is not allowed; ask for between 1 and {1} rows.
