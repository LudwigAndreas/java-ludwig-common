# Descriptions and errors of the identity projection's administrative operations.
ludwig.identity.admin.identity.partner.read=See the registered partners: code, name, status, certificate identifiers and roles.
ludwig.identity.admin.identity.grant.read=See the per-subject data-scope grants.
ludwig.identity.admin.identity.authority.read=See what a subject is entitled to now: roles, attributes and active grants.
ludwig.identity.admin.identity.source.read=See the identity sources: their feeds, user counts by status, and each feed's own state such as a watermark or last sync.
ludwig.identity.admin.identity.partner.onboard=Onboard a partner.
ludwig.identity.admin.identity.partner.replace=Replace a partner's display name, certificate identifiers and roles.
ludwig.identity.admin.identity.partner.suspend=Suspend a partner, so that it can no longer authenticate.
ludwig.identity.admin.identity.partner.activate=Reactivate a suspended partner.
ludwig.identity.admin.identity.grant.create=Grant a subject a data scope, optionally until an expiry.
ludwig.identity.admin.identity.grant.revoke=Revoke a subject's data-scope grant, keeping its history.
ludwig.identity.admin.partner-not-found=There is no partner with code "{0}".
ludwig.identity.admin.partner-exists=A partner with code "{0}" already exists.
ludwig.identity.admin.stale-partner=The partner "{0}" was changed since version {1} was read; read it again and repeat the change.
ludwig.identity.admin.subject-not-found=There is no subject "{0}" in the identity projection.
ludwig.identity.admin.grant-not-found=There is no data-scope grant {0}.
ludwig.identity.admin.dimension-not-accepted=Resource "{0}" accepts no data-scope dimension "{1}" in this deployment.
ludwig.identity.admin.invalid-grant=A grant names its subject, principal type, resource and action, and a dimension value whenever it names a dimension.
ludwig.identity.admin.partner-code-required=A partner is onboarded under a stable code, which the request must name.
