# Russian bundle. Read as UTF-8 - see ProblemMessages, which sets the encoding explicitly rather
# than relying on the platform default.
#
# Every key in ludwig-export-messages.properties must also exist here: a key present in one bundle
# and absent in the other is how a report ends up with half its column headers in English.

# --- request validation -------------------------------------------------------------------------
ludwig.export.error.unknown-definition.title=Отчёт не найден
ludwig.export.error.unknown-definition=Сервис не публикует отчёт "{0}".

ludwig.export.error.unknown-format.title=Формат не поддерживается
ludwig.export.error.unknown-format=Формат "{0}" не поддерживается. Доступные форматы: {1}.

ludwig.export.error.format-not-allowed.title=Формат не поддерживается
ludwig.export.error.format-not-allowed=Этот отчёт нельзя выгрузить в формате "{0}". Разрешённые форматы: {1}.

ludwig.export.error.format-disabled.title=Формат не поддерживается
ludwig.export.error.format-disabled=Формат "{0}" отключён в этой установке. Доступные форматы: {1}.

ludwig.export.error.multi-sheet-unsupported.title=Формат не поддерживается
