ludwig.export.error.output-expired.title=Файл больше недоступен
ludwig.export.error.output-expired=Файл отчёта удалён по истечении срока хранения. Сформируйте отчёт заново.

ludwig.export.error.saved-report-stale.title=Сохранённый отчёт устарел
ludwig.export.error.saved-report-stale=Сохранённый отчёт "{0}" ссылается на "{1}", которого больше нет в отчёте. Измените сохранённый отчёт и повторите запрос.

