ludwig.export.error.enrichment-failed=Отчёт не сформирован: не удалось получить данные из "{0}".

ludwig.export.error.enrichment-key-missing.title=Отчёт не сформирован
ludwig.export.error.enrichment-key-missing=Отчёт не сформирован: в "{0}" нет записи для одного из значений отчёта.

ludwig.export.error.write-failed.title=Отчёт не сформирован
ludwig.export.error.write-failed=Не удалось записать файл отчёта.

ludwig.export.error.sink-unavailable.title=Отчёт не сформирован
ludwig.export.error.sink-unavailable=Отчёт сформирован, но его не удалось сохранить.

ludwig.export.error.required-value-missing.title=Отчёт не сформирован
ludwig.export.error.required-value-missing=В колонке "{0}" нет значения хотя бы в одной строке, а этот отчёт такого не допускает.

