ludwig.export.error.parameters-invalid.title=Некорректные параметры
ludwig.export.error.parameters-invalid=Один или несколько параметров отчёта некорректны. Подробности - в поле "violations".

ludwig.export.error.parameter-invalid.title=Некорректные параметры
ludwig.export.error.parameter-invalid=Значение не удалось прочитать как тип, который ожидает отчёт.

ludwig.export.error.unknown-format-option.title=Некорректный запрос
ludwig.export.error.unknown-format-option=Параметр "{0}" неприменим к формату "{1}". Допустимые параметры: {2}.

ludwig.export.error.invalid-format-option.title=Некорректный запрос
ludwig.export.error.invalid-format-option=Значение "{1}" недопустимо для параметра "{0}".

ludwig.export.error.not-filterable.title=Некорректный запрос
ludwig.export.error.not-filterable=Отчёт "{0}" не поддерживает фильтрацию.

ludwig.export.error.unknown-column.title=Некорректный запрос
ludwig.export.error.unknown-column=В отчёте нет колонки "{0}". Доступные колонки: {1}.

ludwig.export.error.column-forbidden.title=Доступ запрещён
ludwig.export.error.column-forbidden=Выгрузка колонки "{0}" вам недоступна. Доступные колонки: {1}.

ludwig.export.error.unsortable-column.title=Некорректный запрос
ludwig.export.error.unsortable-column=Отчёт нельзя отсортировать по "{0}". Доступные для сортировки колонки: {1}.

ludwig.export.error.report-forbidden.title=Доступ запрещён
ludwig.export.error.report-forbidden=Формирование отчёта "{0}" вам недоступно.

# --- limits and quotas --------------------------------------------------------------------------
ludwig.export.error.row-limit-exceeded.title=Слишком большой отчёт
ludwig.export.error.row-limit-exceeded=Отчёт может содержать не более {0} строк, а достиг {1}. Уточните параметры или фильтр и повторите запрос.

ludwig.export.error.time-budget-exceeded.title=Отчёт выполнялся слишком долго
ludwig.export.error.time-budget-exceeded=Отчёт может выполняться не более {0} секунд, а выполнялся {1}. Уточните параметры или фильтр и повторите запрос.

ludwig.export.error.quota-exceeded.title=Слишком много отчётов
ludwig.export.error.quota-exceeded=Достигнут лимит ({0}) в {1} отчётов. Дождитесь завершения запущенных или повторите запрос позже.

ludwig.export.error.access-revoked.title=Доступ запрещён
ludwig.export.error.access-revoked=После постановки отчёта "{0}" в очередь ваши права изменились, поэтому файл не был сформирован.
ludwig.export.error.identity-unavailable.title=Так сформировать нельзя
ludwig.export.error.identity-unavailable=Отчёт "{0}" читает "{1}" под вашим доступом, а это возможно только пока вы его ждёте. Такой запрос слишком велик, чтобы сформировать его так: сузьте его или попросите администратора выдать отчёту собственный доступ к этим данным.

