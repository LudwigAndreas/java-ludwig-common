architecture.rules.service-name = messaging-db-spring-boot-starter
architecture.rules.report.json-file = target/architecture-report.json
architecture.rules.report.max-violations-per-rule = 5

# The messaging packages of this module: the container, the outbox bridge and the log itself all speak the
# Kafka API by design, so the Kafka rules check them as messaging code rather than passing vacuously.
architecture.rules.conventions.packages.messaging = ..consumer.., ..outbox.., ..log..

# Configuration lives in two packages, for the reason messaging-spring-boot-starter gives: the
# autoconfigurations in config wire the consumer package, and the typed properties in settings are read by
# both, so keeping them together cycles config <-> consumer.
architecture.rules.conventions.packages.configuration.add = ..settings..
