# Descriptions of the database log's administrative operations.
ludwig.messaging-db.admin.messaging.consumer.read=See how far each consumer group is behind on each partition of the database log.
ludwig.messaging-db.admin.messaging.consumer.pause=Pause a consumer group on a topic, on every replica.
ludwig.messaging-db.admin.messaging.consumer.resume=Resume a paused consumer group on a topic.
ludwig.messaging-db.admin.messaging.offset.move=Move a paused consumer group's position on the database log, skipping or replaying records.
ludwig.messaging-db.admin.consumer-not-found=This service has no consumer group "{0}" reading topic "{1}" from the database log.
ludwig.messaging-db.admin.not-paused=Consumer group "{0}" is not paused on topic "{1}"; pause it before moving its position.
ludwig.messaging-db.admin.invalid-target=The move target is not valid: {0}
