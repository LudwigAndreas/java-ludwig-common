# Сообщения персональных токенов доступа.
#
# Каждый ключ здесь разрешается конвейером ProblemDetail из web-core в локали вызывающего. Ни одно
# сообщение не собирается в Java-коде: правило Checkstyle NonAsciiSourceText обеспечивает это для
# русской половины, а английская следует тому же правилу, чтобы обе локали приходили из одного места.
#
# Набор ключей должен в точности совпадать с ludwig-pat-messages.properties. Ключ, присутствующий в
# одной локали и отсутствующий в другой, отображается половине вызывающих как сам ключ.

ludwig.pat.credential-not-permitted = Этот эндпоинт нельзя использовать с персональным токеном доступа. Войдите через сессию и повторите попытку. Токен, способный создать токен, сделал бы отзыв исходного бессмысленным, поэтому ни одна область действия токена этого не разрешает.

ludwig.pat.scopes-required = У персонального токена доступа должна быть хотя бы одна область действия. Токен без областей действия может аутентифицироваться, но ничего не может сделать.
ludwig.pat.audiences-required = Персональный токен доступа должен называть хотя бы один сервис, с которым его можно использовать. Значения по умолчанию нет: токен, действительный везде, - это именно то, что предотвращает данное ограничение.
ludwig.pat.expiry-required = У персонального токена доступа должен быть срок действия.
ludwig.pat.lifetime-too-long = Запрошенный срок действия превышает разрешённый этим сервисом ({0}). Выберите меньший.
ludwig.pat.scope-not-held = Нельзя выдать токену права, которых у вас нет: {0}. Такой токен отклонялся бы при каждом использовании.
ludwig.pat.not-found = Такого персонального токена доступа не существует.

# Единообразный отказ обмена. Намеренно не сообщает ПРИЧИНУ: неизвестный идентификатор ключа, неверный
# секрет, отозванный токен и неподходящая аудитория отображают в точности это предложение. Причина - в
# метриках.
ludwig.pat.credential-rejected = Эти учётные данные не приняты. Проверьте, что токен указан верно, не истёк, не отозван и разрешён для этого сервиса. Просмотреть и заменить свои токены можно по адресу, указанному в этом ответе.
