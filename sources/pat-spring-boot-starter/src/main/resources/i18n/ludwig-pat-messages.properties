# Personal access token messages.
#
# Every key here is resolved by web-core's ProblemDetail pipeline in the caller's locale. No message is
# built in Java source - Checkstyle's NonAsciiSourceText enforces that for the Russian half, and the
# English half follows the same rule so both locales come from the same place.
#
# The key set must match ludwig-pat-messages_ru.properties exactly. A key present in one locale and
# absent from the other renders as the key itself to half the callers.

ludwig.pat.credential-not-permitted = This endpoint cannot be used with a personal access token. Re-authenticate with your session and try again. A token that could create a token would make revoking the original pointless, so no token scope permits this.

ludwig.pat.scopes-required = A personal access token must have at least one scope. A token with no scopes can sign in but do nothing.
ludwig.pat.audiences-required = A personal access token must name at least one service it may be used with. There is no default: a token valid everywhere is what this restriction exists to prevent.
ludwig.pat.expiry-required = A personal access token must have an expiry date.
ludwig.pat.lifetime-too-long = The requested lifetime is longer than this service allows ({0}). Choose a shorter one.
ludwig.pat.scope-not-held = You cannot grant a token permissions you do not have yourself: {0}. Such a token would be refused every time it was used.
ludwig.pat.not-found = No such personal access token.

# The uniform exchange refusal. Deliberately says nothing about WHY: an unknown key id, a bad secret,
# a revoked token and a wrong audience all render this exact sentence. The reason is in the metrics.
ludwig.pat.credential-rejected = This credential was not accepted. Check that the token is correct, has not expired, has not been revoked, and is permitted for this service. You can review and replace your tokens at the location in this response.
