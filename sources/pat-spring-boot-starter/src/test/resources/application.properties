# Test configuration for this module's integration suite.
#
# Every entry here exists because a security-starter startup check refused to let the context load
# without it, which is the checks working rather than getting in the way. Each one is the deliberate
# decision that check demands.

# The audience this test service answers for. Without it ludwig.security.jwt.require-audience=true
# fails startup - correctly: a resource server that skips the audience check accepts any token the
# issuer minted for any service. PatAudienceScopingTest asserts the same validator refuses an
# assertion minted for somebody else.
ludwig.security.jwt.audiences = deploy-service

# No AuthorityResolver in this module's test classpath: identity-projection is not a dependency, and
# adding it to get a bean would be a test dragging in a module the starter does not need. The
# authorities in these tests come from principals built directly, so resolution never runs.
ludwig.security.authorities.require-resolver = false

# mTLS off. This suite exercises the management API, which is reached with a session-derived
# credential; leaving mTLS on would require a trusted-proxies CIDR that means nothing here, and the
# starter refuses an empty one rather than defaulting to something forgeable.
ludwig.security.mtls.enabled = false

# The verification cache's TTL stays inside the security ceiling. Stated rather than defaulted so a
# change to the default does not quietly change what this suite proves.
ludwig.cache.caches.pat-verification.ttl = 30s

# Boot's own Liquibase runs this module's changelog in the test context, rather than the module's
# named ludwigPatLiquibase bean. That is deliberate: Boot wires entityManagerFactory to depend on its
# liquibase bean, so this ordering is the one that guarantees the schema exists before Hibernate
# validates against it. PatLiquibaseAutoConfiguration's own job - registering a NAMED bean that does
# not suppress the application's - is a wiring property, asserted in a context test rather than here.
spring.liquibase.change-log = classpath:db/changelog/pat/pat-changelog.xml

# Hibernate validates against the Liquibase-created schema rather than creating its own. This is the
# assertion that the changelog and the entity agree: letting Hibernate create the tables would test
# the entity against itself and pass happily with a changelog that was wrong.
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view = false

# The exchange's issuer. Without it PatExchangeConfigurationValidator fails startup - which is the
# check working: an assertion minted with no issuer is one no resource server can validate the
# provenance of, so every service would reject it, presenting as "tokens do not work" rather than as
# a missing property. TokenExchangeIT asserts that failure too, in its own context.
ludwig.pat.exchange.issuer = https://idp.test.ludwigandreas.ru

# What this issuer will mint for at all. A separate gate from each token's own audience set: this one
# is the deployment's list, the token's is what that particular token may reach.
ludwig.pat.exchange.audiences = deploy-service,billing-service

# The exchange must be reachable unauthenticated: it CONSUMES a token as its subject rather than
# accepting one as the caller's credential. Without this the edge receives a 401 and no token is ever
# exchanged - which is exactly what TokenExchangeIT saw before this line existed. The actuator paths
# are the security starter's own defaults, repeated because listing the property replaces them.
ludwig.security.public-paths = /actuator/health,/actuator/health/**,/actuator/info,/oauth2/token
