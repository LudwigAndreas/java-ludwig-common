architecture.rules.service-name = pat-spring-boot-starter
architecture.rules.conventions.types.base-entity = ru.ludwigandreas.db.core.entity.AbstractEntity
architecture.rules.conventions.types.base-exception = ru.ludwigandreas.webcore.problem.LocalizedException
architecture.rules.report.json-file = target/architecture-report.json
architecture.rules.report.max-violations-per-rule = 5

# The auto-configuration classes live in ..autoconfigure.. rather than in ..config.., which is the same
# departure file-ingest-spring-boot-starter documents and for the same reason: with the wiring and the
# bound properties in one package, `config` creates the service's beans and the service reads `config`'s
# properties, which is a package cycle the shared cycles rule correctly refused. Splitting them leaves
# `config` holding only PatProperties and the startup validator, and nothing in the module depends on
# `autoconfigure` at all.
#
# Told to the rule library rather than suppressed, so the bean definitions are still required to be in
# one place - which is what the rule is actually for.
architecture.rules.conventions.packages.configuration.add = ..autoconfigure..
