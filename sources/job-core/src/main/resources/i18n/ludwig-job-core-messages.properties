# Descriptions of job-core's administrative operations, shown by GET /me/operations.
ludwig.job-core.admin.job.definition.read=See the scheduled jobs registered in this service, with their schedule and lease.
ludwig.job-core.admin.job.lease.read=See every run lease and which instance holds it.
ludwig.job-core.admin.job.definition.run=Run a scheduled job now.
ludwig.job-core.admin.job.lease.release=Force-release a run lease whose holder is gone.
ludwig.job-core.admin.job-not-found=There is no scheduled job named "{0}" in this service.
ludwig.job-core.admin.lease-not-found=There is no run lease named "{0}".
ludwig.job-core.admin.lease-held=The run lease "{0}" is held by {1}; the job is running there.
ludwig.job-core.admin.lease-not-held=The run lease "{0}" is not held, so there is nothing to release.
ludwig.job-core.admin.shutting-down=The job "{0}" is shutting down on this instance and cannot be started.
ludwig.job-core.admin.replica.instance.read=See the live replicas of this service.
ludwig.job-core.admin.replica.command.read=See a broadcast control and what each replica answered.
ludwig.job-core.admin.control-not-found=There is no replica control named "{0}" in this service.
ludwig.job-core.admin.control-arguments-invalid=The arguments of control "{0}" are not valid: {1}
ludwig.job-core.admin.command-not-found=There is no replica command {0}.
ludwig.job-core.admin.cache.definition.read=See the caches this service runs, with their purpose, tiers and time to live.
ludwig.job-core.admin.cache.performance.evict=Clear a performance cache on every replica.
ludwig.job-core.admin.cache.security.evict=Clear a security cache (authority, revocation) on every replica.
