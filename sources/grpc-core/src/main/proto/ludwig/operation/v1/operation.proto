syntax = "proto3";

// The platform's long-running-operation envelope, on the wire.
//
// This is a MAPPING of ru.ludwigandreas.webcore.operation.OperationResponse and not a second
// vocabulary: OperationMessages in grpc-core is the only code that converts between the two, and a
// unit test iterates web-core's OperationStatus so that a state added there fails this module's
// build until it has a wire value here.
//
// A contract module imports this file and returns Operation. It never declares a status enum of its
// own - the status enum below is the single named exemption from architecture-rules'
// operation-vocabulary rule, and exists only because a wire format cannot import a Java enum.
package ludwig.operation.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_package = "ru.ludwigandreas.operation.grpc.v1";
option java_multiple_files = true;
option java_outer_classname = "OperationProto";

// The six states of OperationStatus, plus the zero value proto3 requires. UNSPECIFIED is never
// produced by the platform; a reader that sees it is talking to something that did not set the
// field, and must not treat it as PENDING.
enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_PENDING = 1;
  OPERATION_STATUS_RUNNING = 2;
  OPERATION_STATUS_SUCCEEDED = 3;
  OPERATION_STATUS_FAILED = 4;
  OPERATION_STATUS_CANCELLED = 5;
  OPERATION_STATUS_EXPIRED = 6;
}

message OperationProgress {
  int64 completed = 1;
  // Absent when the total is not known; zero is a legitimate total.
  optional int64 total = 2;
  string unit = 3;
  string phase = 4;
}

message OperationResult {
  string href = 1;
  string media_type = 2;
  optional int64 size_bytes = 3;
  repeated OperationResult alternatives = 4;
}

message OperationFailure {
  string code = 1;
  string detail = 2;
  repeated string args = 3;
}

message Operation {
  string id = 1;
  OperationStatus status = 2;
  // The owning module's richer lifecycle, verbatim - what OperationResponse.detail() carries.
  string detail = 3;
  OperationProgress progress = 4;
  google.protobuf.Timestamp submitted_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  OperationResult result = 8;
  OperationFailure failure = 9;
  string correlation_id = 10;
  // How long to wait before polling again. Set on a non-terminal operation; the HTTP rendering
  // carries the same value in the Retry-After header.
  google.protobuf.Duration retry_after = 11;
}
