#
# Every container image this platform's tests run, pinned by name, version and sha256 digest.
#
# This file is the single place a digest appears. Before it existed the same postgres literal was
# spelled out in twenty-one source files in three different layouts - one line, split across two
# with a string concatenation, and split-plus-fully-qualified - which meant the next CVE respin of
# postgres:16-alpine was a twenty-one file edit and a `sed` for the full literal silently missed
# every wrapped occurrence, leaving half the build on one digest and half on another.
#
# The pins live in a properties resource rather than as constants in Java source for one concrete
# reason: the `# renovate:` comments below let a dependency bot raise a one-line pull request for the
# next digest. That turns the problem from "a twenty-one file edit somebody has to remember" into
# "review and merge".
#
# A digest is not optional. LudwigTestImages refuses to initialise if any value here lacks an
# @sha256: segment with a 64-character hex digest, because a fixture that quietly fell back to a bare
# tag would reintroduce exactly the policy violation this file exists to prevent: a tag can be
# re-pointed at different content, which turns a reproducible test into one that passes until
# somebody else's release.
#

# renovate: datasource=docker depName=postgres
ludwig.test.image.postgres = postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685

# Kafka is addressed by digest ALONE, with no tag, unlike the other two - and that is forced rather
# than careless. Testcontainers' KRaft-native org.testcontainers.kafka.KafkaContainer re-parses the
# name it is given and rejects the combined tag-and-digest form. The digest is what the pinning is
# actually for, since it is the immutable identity, so the version it corresponds to is recorded here
# instead: apache/kafka 3.8.0. Keep this comment in step with the digest.
# renovate: datasource=docker depName=apache/kafka
ludwig.test.image.kafka = apache/kafka@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069

# The digest is the multi-architecture index, so the same pin resolves on an arm64 laptop and an
# amd64 build agent.
# renovate: datasource=docker depName=localstack/localstack
ludwig.test.image.localstack = localstack/localstack:4.5.0@sha256:9d4253786e0effe974d77fe3c390358391a56090a4fff83b4600d8a64404d95d

# Redis, for cache-spring-boot-starter's shared tier. The digest is the multi-architecture index, so the
# same pin resolves on an arm64 laptop and an amd64 build agent. Only the shared tier's integration tests
# start it; every local-tier test runs with no container at all, which is deliberate - a caching module
# whose whole test suite needed Docker would be a caching module people stop running tests for.
# renovate: datasource=docker depName=redis
ludwig.test.image.redis = redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
