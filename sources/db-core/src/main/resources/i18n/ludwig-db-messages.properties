# Shipped fallback text for this module's exceptions (English), contributed to the shared problem
# pipeline as a ProblemMessageBundle - see DatabaseAutoConfiguration.
#
# Deliberately generic: this module knows the entity class, not what the API calls it. A service
# wanting "No product exists with id X" throws its own LocalizedException, which takes precedence.

ludwig.db.error.entity-not-found.title=Not found
ludwig.db.error.entity-not-found=The requested resource does not exist.

ludwig.db.error.duplicate-entity.title=Already exists
ludwig.db.error.duplicate-entity=A resource with these values already exists.

ludwig.db.error.integrity-violation.title=Conflict
ludwig.db.error.integrity-violation=The request conflicts with data that already exists.

ludwig.db.error.unsupported-id-type.title=Internal error
ludwig.db.error.unsupported-id-type=The request could not be processed. If it keeps happening, quote the trace id from this response.
