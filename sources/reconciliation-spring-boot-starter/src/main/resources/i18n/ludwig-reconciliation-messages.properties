# Descriptions and errors of reconciliation's administrative operations.
ludwig.reconciliation.admin.reconciliation.read=See reconciliation tasks, enumerations, scopes, quotas and what is stuck.
ludwig.reconciliation.admin.reconciliation.operate=Run, backfill, requeue and reset reconciliation tasks and enumeration scopes.
ludwig.reconciliation.admin.reconciliation.privileged=Cancel a remote job, release a quota lease or confirm a withheld sweep - actions that can make this system and the partner disagree.
ludwig.reconciliation.admin.task-not-found=There is no reconciliation task or enumeration named "{0}".
ludwig.reconciliation.admin.enumeration-not-found=There is no enumeration named "{0}"; scope actions apply to enumerations only.
ludwig.reconciliation.admin.remote-job-not-found=There is no remote job {0} for task "{1}".
ludwig.reconciliation.admin.lease-not-found=There is no quota lease {0}.
ludwig.reconciliation.admin.already-running=A run of "{0}" is already in progress; nothing was started.
ludwig.reconciliation.admin.run-not-found=Task "{1}" has no run {0}.
ludwig.reconciliation.admin.manual-run-capacity=Every manual-run slot is busy ({1} at a time); the run of "{0}" was not started. Try again shortly.
ludwig.reconciliation.error.run-failed=The run failed; its log and audit events carry the cause.
ludwig.reconciliation.error.run-timed-out=The run reached its run timeout and stopped early; what it staged still applies.
ludwig.reconciliation.error.run-abandoned=The run outlived its lease: the replica running it stopped before it finished.
ludwig.reconciliation.admin.keys-required=A backfill names the correlation keys to fetch, in the form this task''s key codec writes them.
ludwig.reconciliation.admin.invalid-tier=There is no demand tier "{0}"; use hot or cold.
