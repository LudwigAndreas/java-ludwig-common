# Descriptions and errors of the outbox's administrative operations.
ludwig.outbox.admin.outbox.read=See outbox messages by state, without their payloads.
ludwig.outbox.admin.outbox.operate=Retry failed and dead-lettered outbox messages.
ludwig.outbox.admin.outbox.privileged=Discard an outbox message so that it is never sent.
ludwig.outbox.admin.message-not-found=There is no outbox message with id {0}.
ludwig.outbox.admin.not-retryable=The outbox message {0} is {1}; only FAILED and DEAD_LETTER messages can be retried.
ludwig.outbox.admin.not-discardable=The outbox message {0} is {1}; only PENDING, FAILED and DEAD_LETTER messages can be discarded.
ludwig.outbox.admin.bulk-status-required=A bulk retry names the status to retry: FAILED or DEAD_LETTER.
