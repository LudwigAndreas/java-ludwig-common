spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.enabled=false
logging.level.org.hibernate.SQL=WARN

ludwig.outbox.polling.enabled=false
ludwig.outbox.default-route.transport=STUB
ludwig.outbox.default-route.destination=stub-destination

# The security starter is on this module's test classpath only because it is an optional dependency for the
# administrative endpoints. The outbox's own integration tests ran without it before that edge existed and are
# kept that way; OutboxAdminIntegrationTest switches it back on for itself.
ludwig.security.enabled=false
