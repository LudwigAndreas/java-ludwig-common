# Test-only defaults for this module's integration tests.
#
# security-spring-boot-starter reaches the test classpath through test-support-security, and it refuses to
# start without a JWT audience - deliberately, because a token minted for any service that trusts the same
# issuer would otherwise be accepted. These tests authenticate nothing, so the requirement is turned off
# here rather than a fake audience being invented, which would make the opt-out invisible.
ludwig.security.jwt.require-audience=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=
