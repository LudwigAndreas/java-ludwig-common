# Сообщения для file-action-spring-boot-starter.
#
# Каждый ключ из FileActionProblemCodes должен быть и здесь, и в файле без суффикса локали;
# MessageBundleParityTest останавливает сборку, если наборы ключей расходятся. Проверка на старте в
# FileActionConfigurationValidator дополнительно не даёт приложению запуститься, если в переопределённом
# пакете сообщений ключ потерян: последствие отсутствующего ключа - сырой ключ в отчёте, который читает
# пользователь.
#
# Сообщение адресовано человеку, загрузившему файл, и говорит, что именно в файле нужно исправить.
# Сообщение про ограничение называет само ограничение: "слишком большой" без числа бесполезно.

file-action.too-large=Файл больше, чем допускает этот импорт ({0} байт). Разделите его или воспользуйтесь регламентным массовым импортом.
file-action.too-many-rows=В файле больше строк, чем допускает этот импорт ({0}). Разделите его или воспользуйтесь регламентным массовым импортом.
file-action.unsupported-format=Этот импорт принимает {0}. Сохраните файл в одном из этих форматов и повторите попытку.
file-action.legacy-xls=Это старая книга Excel (.xls), которую нельзя прочитать, не загрузив её целиком в память. Откройте её в Excel и сохраните как .xlsx.
file-action.unreadable=Файл не удалось прочитать как корректный {0}. Возможно, он загружен не полностью - попробуйте загрузить его снова.
file-action.suspicious-archive=Книга разворачивается в объём, несопоставимый с её размером, и не была открыта. Если файл настоящий, сохраните его заново из Excel.
file-action.external-references=Книга берёт значения из другого файла. Скопируйте эти значения в эту книгу и загрузите её снова, чтобы импортировалось именно то, что вы видите.
file-action.missing-column=В файле нет столбца "{0}". Его столбцы: {1}. Скачайте шаблон, чтобы получить ожидаемые заголовки.
file-action.no-header-row=В файле нет строки заголовков. Первая строка должна называть столбцы.
file-action.sheet-not-found=В книге нет листа "{0}".
file-action.empty=Файл пуст.
file-action.scan-rejected=Файл отклонён проверкой безопасности и не был импортирован.
file-action.too-many-rejects=Слишком много строк не удалось использовать, поэтому ничего не импортировано. Обычно это значит, что файл не тот, который ожидает импорт - сверьте заголовки с шаблоном.
file-action.wrong-state=Этот импорт находится в состоянии {0}, его уже нельзя изменить.
file-action.not-found=Для импорта "{0}" нет загрузки {1}.
file-action.confirm-window-closed=Время на подтверждение этого импорта истекло, файл удалён. Загрузите его снова.
file-action.not-confirmable=Этот импорт только проверяет файлы и никогда их не применяет, поэтому подтверждать нечего.
file-action.unknown-action=Импорта "{0}" не существует.
file-action.forbidden=У вас нет прав на использование импорта "{0}". Он требует полномочия {1}.
file-action.cell-not-coercible=Столбец "{0}": "{1}" не является корректным значением типа {2}.
file-action.cell-required=В столбце "{0}" должно быть значение.
file-action.ragged-row=В этой строке другое количество значений, чем в строке заголовков - вероятно, в ней есть разделитель без кавычек.
file-action.constraint-violated={0}: {1}

# Заголовки для скачиваемого отчёта об отклонённых строках.
file-action.report.problems-column=Проблемы
file-action.report.sheet=Лист
file-action.report.row=Строка
file-action.report.column=Столбец
file-action.report.problem=Проблема
