# Messages for file-action-spring-boot-starter.
#
# Every key in FileActionProblemCodes must appear here and in the _ru file, and
# MessageBundleParityTest fails the build when the two key sets differ. The startup check in
# FileActionConfigurationValidator additionally refuses to start an application whose overridden
# bundle has dropped one, because the symptom of a missing key is a raw key in a report a user reads.
#
# A message addressed to the person who uploaded the file says what to change about the file.
# A message about a limit names the limit, because "too large" without a number is unactionable.

file-action.too-large=The file is larger than this import allows ({0} bytes). Split it, or use the scheduled bulk import for a file of that size.
file-action.too-many-rows=The file has more rows than this import allows ({0}). Split it, or use the scheduled bulk import.
file-action.unsupported-format=This import accepts {0}. Save the file in one of those formats and try again.
file-action.legacy-xls=This is an old Excel workbook (.xls), which cannot be read without loading all of it into memory. Open it in Excel and save it as .xlsx.
file-action.unreadable=The file could not be read as a valid {0}. It may be incomplete - try uploading it again.
file-action.suspicious-archive=The workbook expands to far more than its size suggests and was not opened. If it is a genuine file, save a fresh copy from Excel.
file-action.external-references=The workbook takes values from another file. Copy those values into this workbook and upload it again, so that what is imported is what you can see.
file-action.missing-column=The file has no column called "{0}". Its columns are: {1}. Download the template to get the expected headings.
file-action.no-header-row=The file has no heading row. The first row must name the columns.
file-action.sheet-not-found=The workbook has no sheet called "{0}".
file-action.empty=The file is empty.
file-action.scan-rejected=The file was rejected by a security scan and has not been imported.
file-action.too-many-rejects=Too many rows could not be used, so nothing was imported. This usually means the file is not the one this import expects - check the headings against the template.
file-action.wrong-state=This import is {0} and cannot be changed now.
file-action.not-found=No submission {1} for import "{0}".
file-action.confirm-window-closed=The time to confirm this import has passed and the file has been discarded. Upload it again.
file-action.not-confirmable=This import only checks files and never applies them, so there is nothing to confirm.
file-action.unknown-action=There is no import called "{0}".
file-action.forbidden=You do not have permission to use the import "{0}". It requires the authority {1}.
file-action.cell-not-coercible=Column "{0}": "{1}" is not a valid {2}.
file-action.cell-required=Column "{0}" must have a value.
file-action.ragged-row=This row has a different number of values from the heading row - it probably contains an unquoted separator.
file-action.constraint-violated={0}: {1}

# Headings for the downloadable reject report.
file-action.report.problems-column=Problems
file-action.report.sheet=Sheet
file-action.report.row=Row
file-action.report.column=Column
file-action.report.problem=Problem
